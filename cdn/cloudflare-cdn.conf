# ═══════════════════════════════════════════════════════════════
# Cloudflare CDN Configuration for Cortex Freelancer
# ═══════════════════════════════════════════════════════════════
# Since CF tunnels are already in use, leveraging Cloudflare CDN
# is the lowest-friction, highest-impact CDN choice.
#
# This file documents the required Cloudflare dashboard settings
# and the corresponding Page Rules / Cache Rules / Transform Rules.
# ═══════════════════════════════════════════════════════════════

# ── 1. Zone-Level Settings (Dashboard → Speed) ────────────────
# Auto Minify: JS ✓ CSS ✓ HTML ✓
# Brotli: ON
# Early Hints: ON
# HTTP/2: ON (automatic with SSL)
# HTTP/3 (QUIC): ON
# 0-RTT: ON
# Always Use HTTPS: ON
# Rocket Loader: OFF (conflicts with module scripts)

# ── 2. Caching Settings (Dashboard → Caching) ─────────────────
# Caching Level: Standard
# Browser Cache TTL: Respect Existing Headers
# Always Online: ON
# Tiered Cache: ON (Smart Tiered Caching)

# ── 3. Cache Rules (Dashboard → Rules → Cache Rules) ──────────

# Rule 1: Static Assets — Aggressive Edge Cache
# Match: URI Path matches regex \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|mp4|webm)$
# Then:
#   Edge TTL: 30 days
#   Browser TTL: 7 days
#   Cache Status: Cache Everything
#   Origin Cache Control: ON
#   Cache Key: Include query string

# Rule 2: HTML Pages — Short Edge Cache with Revalidation
# Match: URI Path matches regex \.(html?)$ OR URI Path does not contain "."
# Then:
#   Edge TTL: 1 hour
#   Browser TTL: 0 (must-revalidate)
#   Cache Status: Cache Everything
#   Origin Cache Control: ON
#   Bypass cache on cookie: __session|__stripe_mid

# Rule 3: API — No Cache
# Match: URI Path starts with /api/
# Then:
#   Cache Status: Bypass Cache

# Rule 4: WebSocket — No Cache
# Match: URI Path starts with /ws/
# Then:
#   Cache Status: Bypass Cache

# ── 4. Transform Rules (Dashboard → Rules → Transform Rules) ──

# Add Response Headers:
#   Cache-Control varies by path (see cache-headers middleware)
#   X-CDN-Cache: Cloudflare
#   Vary: Accept-Encoding

# ── 5. Page Rules (legacy, use Cache Rules above if available) ─
# cortexfreelancer.com/api/*       → Cache Level: Bypass
# cortexfreelancer.com/ws/*        → Cache Level: Bypass
# cortexfreelancer.com/*.js        → Cache Level: Cache Everything, Edge TTL: 1 month
# cortexfreelancer.com/*.css       → Cache Level: Cache Everything, Edge TTL: 1 month
# cortexfreelancer.com/*           → Cache Level: Cache Everything, Edge TTL: 4 hours
