# ═══════════════════════════════════════════════════════════════
# Nginx CDN-Optimized Configuration for Cortex Freelancer
# ═══════════════════════════════════════════════════════════════
# Drop-in replacement for docker/nginx/nginx.conf when running
# behind Cloudflare CDN. Adds Brotli, pre-compressed serving,
# optimized cache headers, and stale-while-revalidate support.
# ═══════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──
    log_format cdn '$remote_addr - [$time_local] "$request" '
                   '$status $body_bytes_sent '
                   '"$http_cf_ray" "$http_cf_connecting_ip" '
                   'cache=$upstream_cache_status rt=$request_time';
    access_log /var/log/nginx/access.log cdn;

    # ── Performance ──
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 10m;
    
    # ── Open file cache (reduce disk I/O for static files) ──
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ── Gzip (fallback when Brotli unavailable) ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml
        image/svg+xml application/manifest+json
        application/ld+json;

    # ── Brotli (if module loaded) ──
    # brotli on;
    # brotli_comp_level 4;
    # brotli_min_length 1024;
    # brotli_types text/plain text/css text/xml text/javascript
    #     application/javascript application/json application/xml
    #     image/svg+xml application/manifest+json;
    # brotli_static on;  # Serve pre-compressed .br files

    # ── Pre-compressed file serving ──
    gzip_static on;  # Serve pre-compressed .gz files

    # ── Rate limiting ──
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;

    # ── WebSocket upgrade map ──
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ── Cache status map for response header ──
    map $upstream_cache_status $cache_status {
        default $upstream_cache_status;
        '' NONE;
    }

    # ── Proxy cache ──
    proxy_cache_path /var/cache/nginx/static
        levels=1:2 keys_zone=static_cache:50m
        max_size=500m inactive=7d use_temp_path=off;

    # ── Upstream ──
    upstream cortex_backend {
        server cortex-app:3847;
        keepalive 64;
    }

    # ── HTTP → HTTPS redirect ──
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ──
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL certs
        ssl_certificate /etc/letsencrypt/live/${DOMAIN:-localhost}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN:-localhost}/privkey.pem;

        # SSL hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ── Security headers ──
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Cache-Status $cache_status always;

        # ── WebSocket ──
        location /ws/ {
            proxy_pass http://cortex_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            
            # No caching for WebSocket
            add_header Cache-Control "no-store" always;
        }

        # ── API — No cache, rate limited ──
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://cortex_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header CDN-Cache-Control "no-store" always;
        }

        # ── Fonts — Immutable, cache forever ──
        location ~* \.(woff2?|ttf|eot)$ {
            proxy_pass http://cortex_backend;
            proxy_cache static_cache;
            proxy_cache_valid 200 365d;
            
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header CDN-Cache-Control "public, max-age=31536000" always;
            add_header Access-Control-Allow-Origin "*" always;
            proxy_set_header Host $host;
        }

        # ── JS/CSS — Long cache with stale-while-revalidate ──
        location ~* \.(js|css|mjs)$ {
            proxy_pass http://cortex_backend;
            proxy_cache static_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            
            add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800" always;
            add_header CDN-Cache-Control "public, max-age=5184000" always;
            proxy_set_header Host $host;
        }

        # ── Images — Week-long cache ──
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
            proxy_pass http://cortex_backend;
            proxy_cache static_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_use_stale error timeout updating http_500 http_502;
            
            add_header Cache-Control "public, max-age=604800, stale-while-revalidate=604800" always;
            add_header CDN-Cache-Control "public, max-age=1209600" always;
            proxy_set_header Host $host;
        }

        # ── HTML pages — Short cache, always revalidate ──
        location ~* \.html$ {
            proxy_pass http://cortex_backend;
            proxy_cache static_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout updating http_500 http_502;
            
            add_header Cache-Control "public, max-age=3600, must-revalidate, stale-while-revalidate=3600" always;
            add_header CDN-Cache-Control "public, max-age=14400" always;
            add_header Vary "Accept-Encoding, Cookie" always;
            proxy_set_header Host $host;
        }

        # ── Everything else ──
        location / {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://cortex_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Default: short cache for clean URLs (route rewrites → HTML)
            add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        }
    }
}
