# Envoy Proxy Configuration for gRPC-Web
# Enables browser clients to connect to gRPC server via HTTP/2 and gRPC-Web protocol
#
# Usage:
#   docker run -d -p 8080:8080 -v $(pwd)/grpc-proxy-config.yaml:/etc/envoy/envoy.yaml envoyproxy/envoy:v1.24-latest
#
# CFX-027: gRPC Streaming Proxy Configuration

admin:
  address:
    socket_address:
      protocol: TCP
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        protocol: TCP
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          codec_type: auto
          stat_prefix: ingress_http
          
          # Enable CORS for browser clients
          cors:
            allow_origin_string_match:
            - prefix: "*"
            allow_methods: GET, PUT, DELETE, POST, OPTIONS
            allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,custom-header-1,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout,authorization
            max_age: 1728000
            expose_headers: custom-header-1,grpc-status,grpc-message
            
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              
              routes:
              # Health check endpoint
              - match:
                  prefix: "/healthz"
                direct_response:
                  status: 200
                  body:
                    inline_string: "healthy\n"
                    
              # gRPC-Web route to backend gRPC server
              - match:
                  prefix: "/cortex.chat"
                route:
                  cluster: grpc_service
                  timeout: 300s
                  
              # Catch-all route for other gRPC services  
              - match:
                  prefix: "/"
                route:
                  cluster: grpc_service
                  timeout: 300s
                  
          http_filters:
          # gRPC-Web filter for protocol translation
          - name: envoy.filters.http.grpc_web
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
              
          # CORS filter for browser compatibility
          - name: envoy.filters.http.cors
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
              
          # Router filter (must be last)
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              
          # Enable HTTP/2 for better gRPC performance
          http2_protocol_options: {}
          
          # Stream idle timeout for long-running streams
          stream_idle_timeout: 300s
          request_timeout: 300s
          
  clusters:
  - name: grpc_service
    connect_timeout: 30s
    type: logical_dns
    http2_protocol_options: {}
    lb_policy: round_robin
    
    # Health checking
    health_checks:
    - timeout: 5s
      interval: 10s
      unhealthy_threshold: 3
      healthy_threshold: 2
      grpc_health_check:
        service_name: "cortex.chat.ChatService"
        authority: "grpc_service"
        
    load_assignment:
      cluster_name: grpc_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: host.docker.internal  # For Docker Desktop
                port_value: 50051
                
    # Alternative for Linux/production (uncomment and modify as needed):
    # - endpoint:
    #     address:
    #       socket_address:
    #         address: 172.17.0.1  # Docker bridge IP
    #         port_value: 50051
    
    # Circuit breaker settings
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 100
        max_pending_requests: 100
        max_requests: 1000
        max_retries: 5
        
    # Outlier detection for automatic failover
    outlier_detection:
      consecutive_5xx: 3
      interval: 10s
      base_ejection_time: 30s
      max_ejection_percent: 50
      
    # Upstream connection options
    upstream_connection_options:
      tcp_keepalive:
        keepalive_probes: 3
        keepalive_time: 30
        keepalive_interval: 5

# Alternative configuration using grpc-web proxy (simpler, no Docker required)
# Comment out the above and uncomment below to use grpcwebproxy instead of Envoy
#
# Install: go install github.com/improbable-eng/grpc-web/go/grpcwebproxy@latest
# Usage: grpcwebproxy --backend_addr=localhost:50051 --run_tls_server=false --allow_all_origins