[package]
name = "cfx_029_wasm_client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }
wee_alloc = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
regex = "1"
lz4_flex = "0.11"
aes-gcm = "0.10"
getrandom = { version = "0.2", features = ["js"] }
pulldown-cmark = "0.12"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "Performance",
  "Storage",
  "Crypto",
  "SubtleCrypto",
]

[features]
default = ["console_error_panic_hook", "wee_alloc"]

[profile.release]
# Optimize for size and speed
opt-level = "s"
lto = true
debug = false
panic = "abort"
codegen-units = 1