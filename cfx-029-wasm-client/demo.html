<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CFX-029 WASM Client Demo</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; margin: 20px; }
    .row { display: flex; gap: 12px; }
    textarea { width: 100%; height: 90px; }
    #log { white-space: pre-wrap; background: #111; color: #ddd; padding: 12px; border-radius: 8px; height: 240px; overflow: auto; }
    #out { padding: 12px; border: 1px solid #ddd; border-radius: 8px; min-height: 120px; }
    button { padding: 8px 12px; }
    code { background: #f5f5f5; padding: 2px 4px; border-radius: 4px; }
    pre { background: #0b1020; color: #e7eaf0; padding: 12px; border-radius: 8px; overflow:auto; }
  </style>
</head>
<body>
  <h1>CFX-029 WASM Client Demo</h1>
  <p>
    This demo loads the WASM client (<code>pkg/</code>) and installs a thin layer that can wrap <code>window.CortexTransport</code> if present.
    It also demonstrates offline queue persistence via IndexedDB.
  </p>

  <div class="row">
    <button id="btnInit">Init WASM Layer</button>
    <button id="btnStats">Stats</button>
    <button id="btnQueue">Queue Offline Msg</button>
    <button id="btnFlush">Flush Offline Queue (mock send)</button>
  </div>

  <h3>Input</h3>
  <textarea id="input"># Hello\n\nThis is **markdown**.\n\n```js\nconsole.log('code');\n```</textarea>
  <div class="row">
    <button id="btnProcess">Process Markdown (WASM)</button>
    <button id="btnEncrypt">Encrypt+Decrypt (WASM)</button>
    <button id="btnCompress">Compress+Decompress (WASM)</button>
  </div>

  <h3>Output</h3>
  <div id="out"></div>

  <h3>Log</h3>
  <div id="log"></div>

  <script src="./js/storage-adapter.js"></script>
  <script src="./js/wasm-bridge.js"></script>
  <script src="./js/transport-wasm.js"></script>

  <script type="module">
    const logEl = document.getElementById('log');
    const outEl = document.getElementById('out');
    const inputEl = document.getElementById('input');

    function log(...args) {
      const line = args.map(a => typeof a === 'string' ? a : JSON.stringify(a, null, 2)).join(' ');
      logEl.textContent += line + "\n";
      logEl.scrollTop = logEl.scrollHeight;
      console.log(...args);
    }

    let layer = null;

    document.getElementById('btnInit').onclick = async () => {
      layer = await window.installCortexWasmLayer({
        wasm: { wasmPath: './pkg/cfx_029_wasm_client.js', cacheSizeMB: 10, enableEncryption: true }
      });
      log('init:', layer);

      if (window.CortexWasmLayer?.bridge) {
        window.CortexWasmLayer.bridge.on('processed-response', (d) => {
          log('processed-response event');
          outEl.innerHTML = d.processedHtml;
        });
      }
    };

    document.getElementById('btnStats').onclick = async () => {
      if (!window.CortexWasmLayer?.bridge) return log('not initialized');
      log(window.CortexWasmLayer.bridge.getStats());
    };

    document.getElementById('btnProcess').onclick = async () => {
      if (!window.CortexWasmLayer?.bridge) return log('not initialized');
      const md = inputEl.value;
      const html = await window.CortexWasmLayer.bridge.processChunk(md, 'markdown');
      outEl.innerHTML = html;
      log('rendered markdown (html length):', html.length);
    };

    document.getElementById('btnEncrypt').onclick = async () => {
      if (!window.CortexWasmLayer?.bridge) return log('not initialized');
      const txt = inputEl.value;
      const enc = await window.CortexWasmLayer.bridge.encryptData(txt);
      const dec = await window.CortexWasmLayer.bridge.decryptData(enc);
      log('enc bytes:', enc.length, 'dec matches:', dec === txt);
    };

    document.getElementById('btnCompress').onclick = async () => {
      if (!window.CortexWasmLayer?.bridge) return log('not initialized');
      const txt = inputEl.value.repeat(10);
      const comp = await window.CortexWasmLayer.bridge.compressData(txt);
      const dec = await window.CortexWasmLayer.bridge.decompressData(comp);
      log('orig:', txt.length, 'comp:', comp.length, 'ok:', dec === txt);
    };

    document.getElementById('btnQueue').onclick = async () => {
      if (!window.CortexWasmLayer?.bridge) return log('not initialized');
      const payload = JSON.stringify({ type: 'user', content: inputEl.value, id: `offline_${Date.now()}`, timestamp: Date.now() });
      await window.CortexWasmLayer.bridge.queueMessage(payload, 150);
      log('queued offline message');
    };

    document.getElementById('btnFlush').onclick = async () => {
      if (!window.CortexWasmLayer?.bridge) return log('not initialized');
      await window.CortexWasmLayer.flushOfflineQueue(async (content) => {
        // mock send
        log('[mock send]', content.slice(0, 60) + (content.length > 60 ? '...' : ''));
      });
      log('flush complete');
    };

  </script>
</body>
</html>
