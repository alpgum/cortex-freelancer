# Render.com Blueprint — Cortex Freelancer
# Fallback deployment alongside Railway (primary)
# Docs: https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Connect repo at https://render.com/new/blueprint
#   2. Select this render.yaml
#   3. Fill in environment variables marked sync: false
#   4. Deploy
#
# WebSocket: Render natively supports WS/WSS on web services.
# The /ws/chat endpoint works without additional proxy config.

services:
  # ── Production Web Service ──
  - type: web
    name: cortex-freelancer
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      # ── Runtime ──
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: WS_TIMEOUT_PROFILE
        value: production
      # ── Stripe ──
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      # ── Firebase ──
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      # ── AI ──
      - key: ANTHROPIC_API_KEY
        sync: false
      # ── Admin ──
      - key: ADMIN_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # ── Email & Notifications ──
      - key: RESEND_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      # ── Monitoring ──
      - key: SENTRY_DSN
        sync: false
      # ── Analytics ──
      - key: GA_MEASUREMENT_ID
        sync: false
      # ── Cron ──
      - key: CRON_SECRET
        sync: false
      # ── Domain ──
      - key: DOMAIN
        sync: false

  # ── Staging (preview) — deploys from non-main branches ──
  # Uncomment when ready for branch-based previews:
  # - type: web
  #   name: cortex-freelancer-staging
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile.render
  #   plan: starter
