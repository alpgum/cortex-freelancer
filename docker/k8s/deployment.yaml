apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-freelancer
  namespace: cortex-freelancer
  labels:
    app: cortex-freelancer
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cortex-freelancer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cortex-freelancer
        version: v1
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: cortex
          image: ghcr.io/OWNER/cortex-freelancer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3847
              protocol: TCP
              name: http
          envFrom:
            - secretRef:
                name: cortex-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3847"
            - name: PLATFORM
              value: kubernetes
            - name: WS_TIMEOUT_PROFILE
              value: production
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /app/tmp
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
