# ============================================================================
# Cortex Freelancer — Local Development Compose
# ============================================================================
# Usage:
#   docker compose -f docker/docker-compose.dev.yml up
#
# Features:
#   - Hot reload via volume mount (source code)
#   - Node.js --watch mode
#   - No Chromium (faster builds)
#   - Debug port exposed
# ============================================================================

version: "3.8"

services:
  cortex-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.universal
      target: slim-final
    container_name: cortex-dev
    environment:
      - NODE_ENV=development
      - PORT=3847
      - PLATFORM=docker-dev
    env_file:
      - ../.env.local
    ports:
      - "3847:3847"
      - "9229:9229"  # Node.js debugger
    volumes:
      # Mount source for hot reload (exclude node_modules)
      - ..:/app
      - /app/node_modules
      - cortex-dev-logs:/app/logs
    networks:
      - cortex-dev-net
    command: ["node", "--watch", "--inspect=0.0.0.0:9229", "server.js"]
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  cortex-dev-logs:

networks:
  cortex-dev-net:
    driver: bridge
