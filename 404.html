<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;--bg2:#111111;--bg3:#1a1a1a;
  --text:#f0f0f0;--text2:#b0b0b0;--text3:#666666;
  --orange:#ff8844;--orange2:#ff6622;
  --green:#00ff88;--green2:#00cc6a;
  --radius:16px;--radius-sm:10px;
}
html{font-size:16px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--orange);text-decoration:none;transition:color .2s}
a:hover{color:var(--green)}

nav{padding:1rem 2rem;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.05)}
.nav-logo{font-size:1.1rem;font-weight:800;letter-spacing:2px;color:var(--orange);text-decoration:none}

.container{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem}
.content{text-align:center;max-width:520px}

.illustration{position:relative;width:200px;height:160px;margin:0 auto 2rem}
.ghost{width:80px;height:100px;background:var(--bg2);border:2px solid rgba(255,255,255,.1);border-radius:40px 40px 0 0;position:absolute;left:50%;top:20px;transform:translateX(-50%);animation:ghostFloat 3s ease-in-out infinite}
.ghost::before{content:'';position:absolute;bottom:-20px;left:0;width:80px;height:20px;background:var(--bg2);border-left:2px solid rgba(255,255,255,.1);border-right:2px solid rgba(255,255,255,.1);clip-path:polygon(0 0,20% 0,25% 100%,35% 0,50% 0,55% 100%,65% 0,80% 0,85% 100%,100% 0,100% 100%,0 100%)}
.ghost-eye{width:10px;height:14px;background:var(--orange);border-radius:50%;position:absolute;top:35px}
.ghost-eye.left{left:20px}
.ghost-eye.right{right:20px}
.ghost-mouth{width:16px;height:8px;border:2px solid var(--orange);border-top:none;border-radius:0 0 16px 16px;position:absolute;top:55px;left:50%;transform:translateX(-50%)}
@keyframes ghostFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-12px)}}

.four-text{font-size:6rem;font-weight:900;letter-spacing:-4px;line-height:1;margin-bottom:.5rem;background:linear-gradient(135deg,var(--text),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tagline{font-size:1.2rem;font-weight:600;margin-bottom:.5rem}
.desc{color:var(--text2);font-size:.95rem;margin-bottom:2rem;line-height:1.6}

.search-box{display:flex;gap:.5rem;margin-bottom:2rem;max-width:400px;margin-left:auto;margin-right:auto}
.search-box input{flex:1;background:var(--bg2);border:1px solid rgba(255,255,255,.1);padding:.75rem 1rem;border-radius:var(--radius-sm);font-size:.95rem;color:var(--text);outline:none;font-family:inherit}
.search-box input:focus{border-color:var(--orange)}
.search-box button{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#000;border:none;padding:.75rem 1.2rem;border-radius:var(--radius-sm);font-weight:700;font-size:.9rem;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
.search-box button:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(255,136,68,.3)}

.quick-links{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.quick-link{display:inline-flex;align-items:center;gap:.4rem;background:var(--bg2);border:1px solid rgba(255,255,255,.08);padding:.6rem 1.2rem;border-radius:100px;font-size:.85rem;font-weight:600;color:var(--text2);transition:all .2s}
.quick-link:hover{border-color:var(--orange);color:var(--orange);transform:translateY(-1px)}

@media(max-width:480px){
  .four-text{font-size:4rem}
  .container{padding:1.5rem}
  nav{padding:.75rem 1rem}
  .search-box{flex-direction:column}
  .quick-links{flex-direction:column;align-items:center}
  .search-box button{min-height:44px}
  .quick-link{min-height:44px}
  button,a.btn-primary,a.btn-secondary{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  input,select,textarea{font-size:16px}
}

.skip-link{position:absolute;top:-100%;left:1rem;background:var(--orange,#ff8844);color:#000;padding:.75rem 1.5rem;border-radius:8px;font-weight:700;font-size:.9rem;z-index:9999;transition:top .2s}.skip-link:focus{top:1rem}
:focus-visible{outline:2px solid var(--orange,#ff8844);outline-offset:2px}
</style>
<link rel="stylesheet" href="/app/theme.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>

<nav role="navigation">
  <a href="/" class="nav-logo">CORTEX</a>
</nav>

<main class="container" id="main-content" role="main">
  <div class="content">
    <div class="illustration">
      <div class="ghost">
        <div class="ghost-eye left"></div>
        <div class="ghost-eye right"></div>
        <div class="ghost-mouth"></div>
      </div>
    </div>
    <h1 class="four-text">404</h1>
    <p class="tagline">Looks like this page went freelance.</p>
    <p class="desc">It's out there somewhere, but not here. Maybe it took a gig on another server. Let's get you back on track.</p>

    <form class="search-box" onsubmit="handleSearch(event)">
      <input type="text" id="searchInput" placeholder="Search Cortex..." aria-label="Search">
      <button type="submit">Search</button>
    </form>

    <div class="quick-links">
      <a href="/" class="quick-link">Home</a>
      <a href="/app" class="quick-link">Tools</a>
      <a href="/pricing" class="quick-link">Pricing</a>
      <a href="/support" class="quick-link">Support</a>
    </div>
  </div>
</main>

<script>
function handleSearch(e) {
  e.preventDefault();
  var q = document.getElementById('searchInput').value.trim();
  if (q) window.location.href = '/?q=' + encodeURIComponent(q);
}
</script>
<script src="/app/analytics.js"></script>
<script>
// [385] Track 404 occurrences in GA4
(function() {
  if (typeof CortexAnalytics !== 'undefined' && CortexAnalytics.track) {
    CortexAnalytics.track('page_not_found', {
      path: window.location.pathname,
      referrer: document.referrer || '(direct)',
      search: window.location.search
    });
  }
})();
</script>
<script defer src="/app/theme.js"></script>
</body>
</html>
