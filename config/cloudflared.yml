# Cloudflare Named Tunnel Configuration for Cortex Freelancer
# 
# Setup (one-time):
#   cloudflared tunnel login
#   cloudflared tunnel create cortex-freelancer
#   cloudflared tunnel route dns cortex-freelancer api.cortexfreelancer.com
#
# Run:
#   cloudflared tunnel --config config/cloudflared.yml run
#
# This replaces ephemeral quick tunnels with a stable URL.

# Replace with your actual tunnel name/ID after creation
tunnel: cortex-freelancer
# credentials-file: ~/.cloudflared/<tunnel-id>.json

ingress:
  # WebSocket + HTTP traffic to the Cortex Freelancer server
  - hostname: api.cortexfreelancer.com
    service: http://localhost:3847
    originRequest:
      # Connection timeout for initial connection to origin
      connectTimeout: 30s
      # Keep origin connections alive longer (OpenClaw can take 120s)
      keepAliveTimeout: 120s
      # Pool of keep-alive connections to origin
      keepAliveConnections: 10
      # Don't buffer responses — critical for WebSocket streaming
      noTLSVerify: false
      # HTTP/2 origin support
      http2Origin: false
  # Catch-all: return 404 for unmatched hostnames
  - service: http_status:404
