# CFX-018: Production SSL Configuration Snippet for Nginx
# Include this in your server{} block: include /etc/nginx/ssl/nginx-ssl.conf;
#
# Target: A+ on SSL Labs
# Requires: Let's Encrypt or equivalent certificate

# ── TLS Protocol ──
ssl_protocols TLSv1.2 TLSv1.3;

# ── Cipher Suites ──
# TLS 1.3 ciphers are configured automatically by OpenSSL
# TLS 1.2 ciphers: AEAD-only, forward secrecy required
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# Let client choose preferred cipher (modern clients prefer TLS 1.3 native ciphers)
ssl_prefer_server_ciphers off;

# ── Session Caching ──
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;  # Disable for perfect forward secrecy

# ── OCSP Stapling ──
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

# ── DH Parameters (if needed for older TLS 1.2 clients) ──
# Generate: openssl dhparam -out /etc/letsencrypt/ssl-dhparams.pem 2048
# ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

# ── Security Headers ──
# HSTS: 1 year, include subdomains, preload-ready
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking protection
add_header X-Frame-Options "DENY" always;

# XSS: disable legacy filter, rely on CSP
add_header X-XSS-Protection "0" always;

# Referrer control
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Feature policy
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;

# Content Security Policy (adjust per app needs)
# Start in report-only, then switch to enforcing
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com wss://*.cortexfreelancer.com https://api.stripe.com https://www.google-analytics.com; frame-src https://js.stripe.com https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com;" always;

# Prevent caching of sensitive responses
add_header Cache-Control "no-store" always;
# (Override in static asset locations with public, max-age)
