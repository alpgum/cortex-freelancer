version: "3.8"

services:
  # ── Cortex Freelancer App ──
  cortex-app:
    build:
      context: ../..
      dockerfile: infrastructure/digitalocean/Dockerfile.digitalocean
    container_name: cortex-app
    restart: unless-stopped
    env_file:
      - ../../.env.production.local
    environment:
      - NODE_ENV=production
      - PORT=3847
    ports:
      - "127.0.0.1:3847:3847"
    volumes:
      - app-logs:/app/logs
    networks:
      - cortex-net
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3847/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Nginx Reverse Proxy ──
  nginx:
    image: nginx:1.27-alpine
    container_name: cortex-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    networks:
      - cortex-net
    depends_on:
      cortex-app:
        condition: service_healthy

  # ── Certbot (SSL) — auto-renewal every 12h ──
  certbot:
    image: certbot/certbot:latest
    container_name: cortex-certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --deploy-hook \"docker exec cortex-nginx nginx -s reload\" --quiet; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

volumes:
  app-logs:
  certbot-webroot:
  certbot-certs:

networks:
  cortex-net:
    driver: bridge
