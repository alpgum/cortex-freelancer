<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex Freelancer - Offline</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .offline-container {
            text-align: center;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .retry-button {
            background: white;
            color: #6366f1;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .retry-button:hover {
            transform: translateY(-2px);
        }
        
        .features-list {
            margin-top: 40px;
            text-align: left;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        .feature-icon {
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 12px;
        }
        
        @media (max-width: 600px) {
            .offline-container {
                padding: 30px 20px;
                margin: 20px;
            }
            
            h1 {
                font-size: 28px;
            }
            
            p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            🌐
        </div>
        
        <h1>You're Offline</h1>
        <p>No internet connection available. Don't worry - Cortex Freelancer works offline too!</p>
        
        <button class="retry-button" onclick="checkConnection()">
            Try Again
        </button>
        
        <div class="features-list">
            <div class="feature-item">
                <div class="feature-icon">📝</div>
                <span>View cached job listings</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">💼</div>
                <span>Draft proposals offline</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">📊</div>
                <span>Review analytics data</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🔄</div>
                <span>Auto-sync when online</span>
            </div>
        </div>
    </div>

    <script>
        function checkConnection() {
            if (navigator.onLine) {
                window.location.reload();
            } else {
                // Show animation or feedback
                const button = document.querySelector('.retry-button');
                button.textContent = 'Still Offline...';
                setTimeout(() => {
                    button.textContent = 'Try Again';
                }, 2000);
            }
        }
        
        // Auto-reload when connection is restored
        window.addEventListener('online', () => {
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        });
        
        // Update UI based on connection status
        window.addEventListener('offline', () => {
            console.log('🔴 Connection lost');
        });
        
        window.addEventListener('online', () => {
            console.log('🟢 Connection restored');
        });
    </script>
</body>
</html>
