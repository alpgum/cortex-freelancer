# CFX-016: Nginx Load Balancer Configuration (Alternative to Cloudflare LB)
# Use this if running on a dedicated VPS/droplet instead of Cloudflare LB
#
# Deploy to: /etc/nginx/conf.d/cortex-lb.conf
# Requires: nginx with stream module for WebSocket

upstream cortex_backends {
    # Priority-based: Railway first, Render second, DO third
    # Use 'backup' directive for failover behavior
    
    server railway-app.up.railway.app:443     weight=10;
    server cortex-freelancer.onrender.com:443 weight=5 backup;
    server DO_DROPLET_IP:443                  weight=1 backup;

    # Sticky sessions for WebSocket (ip_hash)
    ip_hash;

    # Keep connections alive to backends
    keepalive 32;
    keepalive_timeout 60s;
}

# Health check (requires nginx-plus or lua module for active checks)
# For open-source nginx, use passive health checks:
# - max_fails: number of failed requests before marking unhealthy
# - fail_timeout: how long to mark as unhealthy

server {
    listen 443 ssl http2;
    server_name cortexfreelancer.com;

    ssl_certificate /etc/letsencrypt/live/cortexfreelancer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cortexfreelancer.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=120r/m;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # WebSocket endpoint — sticky sessions critical here
    location /ws/ {
        proxy_pass https://cortex_backends;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host cortexfreelancer.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check endpoint (passthrough — for external monitors)
    location /api/health {
        proxy_pass https://cortex_backends;
        proxy_http_version 1.1;
        proxy_set_header Host cortexfreelancer.com;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # API routes with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass https://cortex_backends;
        proxy_http_version 1.1;
        proxy_set_header Host cortexfreelancer.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Static assets — cache aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        limit_req zone=general_limit burst=40 nodelay;
        proxy_pass https://cortex_backends;
        proxy_http_version 1.1;
        proxy_set_header Host cortexfreelancer.com;
        proxy_set_header Connection "";
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Everything else
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass https://cortex_backends;
        proxy_http_version 1.1;
        proxy_set_header Host cortexfreelancer.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name cortexfreelancer.com;
    return 301 https://$host$request_uri;
}
