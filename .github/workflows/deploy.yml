name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ── Gate: lint + secrets scan ──────────────────────────────
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for leaked secrets
        run: |
          FOUND=0
          if grep -rn "sk_live_" --include="*.js" --include="*.html" --include="*.json" \
               --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::Stripe secret key in source"
            FOUND=1
          fi
          if grep -rPn '(SECRET|PASSWORD|TOKEN|PRIVATE_KEY)\s*=\s*["\x27][A-Za-z0-9]' \
               --include="*.js" --include="*.html" \
               --exclude-dir=node_modules --exclude-dir=.git \
               --exclude="*.example" --exclude=".env.example" . 2>/dev/null; then
            echo "::error::Hardcoded secret detected"
            FOUND=1
          fi
          [ "$FOUND" -eq 0 ] && echo "No secrets found."
          exit $FOUND

      - name: Validate vercel.json
        run: python3 -m json.tool vercel.json > /dev/null && echo "vercel.json valid"

  # ── Gate: validate server loads ────────────────────────────
  validate:
    name: Validate & Health Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run pre-deploy checks
        run: node scripts/pre-deploy.js

      - name: Validate config schema
        run: npm run config:validate || true

  # ── Preview: deploy PR branches ────────────────────────────
  preview:
    name: Preview Deploy
    needs: [lint, validate]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel config
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: |
          URL=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $URL"

      - name: Comment PR with preview URL
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            if (!url || url.includes('Error')) return;
            const body = `🚀 **Preview deployed**: ${url}\n\nHealth: ${url}/api/health`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Preview deployed'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Production: deploy main branch ────────────────────────
  production:
    name: Production Deploy
    needs: [lint, validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        id: deploy
        run: |
          URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production: $URL"

      - name: Smoke test production
        run: |
          echo "Waiting for deployment to propagate..."
          sleep 10
          URL="${{ steps.deploy.outputs.url }}"

          # Health endpoint
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$URL/api/health" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Health check returned $STATUS"
          else
            echo "Health check passed"
          fi

          # Homepage
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$URL/" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Homepage returned $STATUS"
          else
            echo "Homepage OK"
          fi

          # Key routes
          for route in /pricing /tools /app /login; do
            S=$(curl -sf -o /dev/null -w "%{http_code}" "$URL$route" || echo "000")
            echo "$route → $S"
          done
