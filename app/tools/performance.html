<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance — Cortex Freelancer</title>
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/shared/css/navigation.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    :root{--bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a22;--bg4:#222230;--text:#f0f0f0;--text2:#b0b0b0;--text3:#666;--orange:#ff8844;--orange2:#ff6622;--green:#00ff88;--green2:#00cc6a;--red:#ff4444;--yellow:#ffc800;--blue:#4488ff;--purple:#aa66ff;--radius:16px;--radius-sm:10px}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;line-height:1.6;overflow-x:hidden}

    .perf-page{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
    .perf-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:16px}
    .perf-header h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,#ff8844,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .period-tabs{display:flex;gap:6px;background:var(--bg2);border-radius:10px;padding:4px}
    .period-tab{padding:8px 16px;border-radius:8px;border:none;background:none;color:var(--text3);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
    .period-tab.active{background:var(--orange);color:#fff}

    /* KPI Cards */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
    .kpi-card{background:var(--bg2);border:1px solid rgba(255,255,255,.05);border-radius:var(--radius);padding:20px}
    .kpi-label{font-size:12px;text-transform:uppercase;color:var(--text3);font-weight:600;letter-spacing:.5px}
    .kpi-value{font-size:32px;font-weight:800;margin:4px 0}
    .kpi-value.orange{color:var(--orange)}.kpi-value.green{color:var(--green)}.kpi-value.blue{color:var(--blue)}.kpi-value.purple{color:var(--purple)}
    .kpi-change{font-size:12px;font-weight:600}
    .kpi-change.up{color:var(--green)}.kpi-change.down{color:var(--red)}

    /* Charts */
    .chart-section{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:28px}
    @media(max-width:768px){.chart-section{grid-template-columns:1fr}}
    .chart-card{background:var(--bg2);border:1px solid rgba(255,255,255,.05);border-radius:var(--radius);padding:24px}
    .chart-card h3{font-size:16px;font-weight:700;margin-bottom:16px}
    .chart-bar-wrap{display:flex;flex-direction:column;gap:10px}
    .chart-bar-row{display:flex;align-items:center;gap:12px}
    .chart-bar-label{width:50px;font-size:12px;color:var(--text3);text-align:right;flex-shrink:0}
    .chart-bar-track{flex:1;height:28px;background:var(--bg3);border-radius:6px;overflow:hidden;position:relative}
    .chart-bar-fill{height:100%;border-radius:6px;transition:width .6s ease}
    .chart-bar-fill.orange{background:linear-gradient(90deg,#ff8844,#ff6622)}
    .chart-bar-fill.green{background:linear-gradient(90deg,#00ff88,#00cc6a)}
    .chart-bar-fill.blue{background:linear-gradient(90deg,#4488ff,#2266ee)}
    .chart-bar-val{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:rgba(255,255,255,.9)}

    /* Goals */
    .goals-section{margin-bottom:28px}
    .goals-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
    .goal-card{background:var(--bg2);border:1px solid rgba(255,255,255,.05);border-radius:var(--radius);padding:20px}
    .goal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .goal-label{font-size:14px;font-weight:600}
    .goal-status{font-size:11px;padding:4px 10px;border-radius:12px;font-weight:600}
    .goal-status.achieved{background:rgba(0,255,136,.15);color:var(--green)}
    .goal-status.on-track{background:rgba(68,136,255,.15);color:var(--blue)}
    .goal-status.in-progress{background:rgba(255,200,0,.15);color:var(--yellow)}
    .goal-status.behind{background:rgba(255,68,68,.15);color:var(--red)}
    .goal-progress-bar{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-bottom:8px}
    .goal-progress-fill{height:100%;border-radius:4px;transition:width .6s}
    .goal-stats{display:flex;justify-content:space-between;font-size:12px;color:var(--text3)}

    /* Insights */
    .insights-section{margin-bottom:28px}
    .insight-card{background:var(--bg2);border-left:3px solid;border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:16px 20px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
    .insight-card.success{border-color:var(--green)}.insight-card.warning{border-color:var(--yellow)}.insight-card.info{border-color:var(--blue)}.insight-card.tip{border-color:var(--purple)}
    .insight-icon{font-size:20px;flex-shrink:0}
    .insight-body{flex:1}
    .insight-msg{font-size:14px;font-weight:600;margin-bottom:4px}
    .insight-action{font-size:13px;color:var(--text3)}

    /* Demo Toggle */
    .demo-toggle-wrap{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:10px;padding:8px 16px}
    .demo-toggle-wrap label{font-size:13px;color:var(--text2);font-weight:500}
    .demo-switch{position:relative;width:44px;height:24px;cursor:pointer}
    .demo-switch input{display:none}
    .demo-switch .slider{position:absolute;inset:0;background:var(--bg4);border-radius:12px;transition:.3s}
    .demo-switch .slider::before{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.3s}
    .demo-switch input:checked+.slider{background:var(--orange)}
    .demo-switch input:checked+.slider::before{transform:translateX(20px)}
    #demo-badge{display:none;background:var(--orange);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}

    /* Forecast */
    .forecast-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
    .forecast-row:last-child{border-bottom:none}
    .forecast-label{width:80px;font-size:13px;color:var(--text2)}
    .forecast-bars{flex:1;display:flex;gap:2px;align-items:center}
    .forecast-bar{height:20px;border-radius:4px;min-width:2px}
    .forecast-val{font-size:13px;font-weight:600;width:80px;text-align:right}

    .section-title{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  </style>
</head>
<body>
  <main class="perf-page">
    <div class="perf-header">
      <div>
        <h1>📊 Performance Analytics</h1>
        <p style="font-size:14px;color:var(--text3);margin-top:4px">Track your freelance business growth</p>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <div class="demo-toggle-wrap">
          <label>Demo Mode</label>
          <label class="demo-switch"><input type="checkbox" id="demo-toggle" onchange="handleDemoToggle()"><span class="slider"></span></label>
          <span id="demo-badge">DEMO</span>
        </div>
        <div class="period-tabs" id="period-tabs">
          <button class="period-tab" data-period="week">Week</button>
          <button class="period-tab active" data-period="month">Month</button>
          <button class="period-tab" data-period="quarter">Quarter</button>
          <button class="period-tab" data-period="year">Year</button>
        </div>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="kpi-grid" id="kpi-grid"></div>

    <!-- Charts -->
    <div class="chart-section">
      <div class="chart-card">
        <h3>📈 Revenue Trend</h3>
        <div class="chart-bar-wrap" id="revenue-chart"></div>
      </div>
      <div class="chart-card">
        <h3>🎯 Proposal Outcomes</h3>
        <div class="chart-bar-wrap" id="proposal-chart"></div>
      </div>
    </div>

    <!-- Goals -->
    <div class="goals-section">
      <div class="section-title">🏆 Goals & Progress</div>
      <div class="goals-grid" id="goals-grid"></div>
    </div>

    <!-- Revenue Forecast -->
    <div class="chart-card" style="margin-bottom:28px">
      <h3>🔮 Revenue Forecast (Next 6 Months)</h3>
      <div id="forecast-chart"></div>
    </div>

    <!-- Insights -->
    <div class="insights-section">
      <div class="section-title">💡 AI Insights & Recommendations</div>
      <div id="insights-container"></div>
    </div>

    <!-- Back to Dashboard -->
    <div style="text-align:center;margin-top:32px">
      <a href="dashboard.html" style="color:var(--orange);font-weight:600;font-size:15px">← Back to Dashboard</a>
    </div>
  </main>

  <script src="js/payment-simulation.js"></script>
  <script src="js/performance-dashboard.js"></script>
  <script src="js/demo-workflow.js"></script>
  <script src="js/ai-memory-system.js"></script>
  <script>
    var currentPeriod = 'month';

    function init() {
      // Check if demo data needed
      if (typeof DemoWorkflow !== 'undefined' && DemoWorkflow.isDemo()) {
        document.getElementById('demo-toggle').checked = true;
        document.getElementById('demo-badge').style.display = 'inline-flex';
      }

      // Period tabs
      document.querySelectorAll('.period-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.period-tab').forEach(function(t) { t.classList.remove('active'); });
          this.classList.add('active');
          currentPeriod = this.dataset.period;
          renderAll();
        });
      });

      renderAll();
    }

    function handleDemoToggle() {
      if (typeof DemoWorkflow !== 'undefined') DemoWorkflow.toggleDemo();
      if (typeof PaymentSimulation !== 'undefined') PaymentSimulation.seedDemoPayments();
      if (typeof PerformanceDashboard !== 'undefined') PerformanceDashboard.seedDemoData();
      document.getElementById('demo-badge').style.display = document.getElementById('demo-toggle').checked ? 'inline-flex' : 'none';
      renderAll();
    }

    function renderAll() {
      var metrics = PerformanceDashboard.getMetrics(currentPeriod);
      renderKPIs(metrics);
      renderRevenueChart(metrics);
      renderProposalChart(metrics);
      renderGoals(metrics);
      renderForecast();
      renderInsights(metrics);
    }

    function renderKPIs(m) {
      var kpis = [
        { label: 'Revenue', value: '$' + m.revenue.total.toLocaleString(), color: 'green', change: m.revenue.count + ' payments' },
        { label: 'Proposals Sent', value: m.proposals.total, color: 'orange', change: m.proposals.winRate + '% win rate' },
        { label: 'Active Projects', value: m.projects.active, color: 'blue', change: m.projects.completed + ' completed' },
        { label: 'Hours Logged', value: m.time.totalHours + 'h', color: 'purple', change: m.time.avgDailyHours + 'h avg/day' },
        { label: 'Pending Invoices', value: '$' + m.revenue.pending.toLocaleString(), color: 'orange', change: m.revenue.pendingCount + ' invoices' },
        { label: 'Pipeline Value', value: '$' + m.proposals.totalValue.toLocaleString(), color: 'green', change: m.proposals.interviewRate + '% interview rate' }
      ];

      var html = '';
      kpis.forEach(function(k) {
        html += '<div class="kpi-card"><div class="kpi-label">' + k.label + '</div>';
        html += '<div class="kpi-value ' + k.color + '">' + k.value + '</div>';
        html += '<div class="kpi-change">' + k.change + '</div></div>';
      });
      document.getElementById('kpi-grid').innerHTML = html;
    }

    function renderRevenueChart(m) {
      var data = PerformanceDashboard.getRevenueChartData(6);
      var max = Math.max.apply(null, data.map(function(d) { return d.revenue; })) || 1;
      var html = '';
      data.forEach(function(d) {
        var pct = Math.round((d.revenue / max) * 100);
        html += '<div class="chart-bar-row"><span class="chart-bar-label">' + d.label + '</span>';
        html += '<div class="chart-bar-track"><div class="chart-bar-fill green" style="width:' + pct + '%"></div>';
        html += '<span class="chart-bar-val">$' + d.revenue.toLocaleString() + '</span></div></div>';
      });
      document.getElementById('revenue-chart').innerHTML = html;
    }

    function renderProposalChart(m) {
      var statuses = [
        { label: 'Won', count: m.proposals.byStatus.accepted || 0, color: 'green' },
        { label: 'Interview', count: m.proposals.byStatus.interview || 0, color: 'blue' },
        { label: 'Pending', count: (m.proposals.byStatus.pending || 0) + (m.proposals.byStatus.sent || 0), color: 'orange' },
        { label: 'Declined', count: m.proposals.byStatus.declined || 0, color: 'orange' }
      ];
      var max = Math.max.apply(null, statuses.map(function(s) { return s.count; })) || 1;
      var html = '';
      statuses.forEach(function(s) {
        var pct = Math.round((s.count / max) * 100);
        html += '<div class="chart-bar-row"><span class="chart-bar-label">' + s.label + '</span>';
        html += '<div class="chart-bar-track"><div class="chart-bar-fill ' + s.color + '" style="width:' + pct + '%"></div>';
        html += '<span class="chart-bar-val">' + s.count + '</span></div></div>';
      });
      document.getElementById('proposal-chart').innerHTML = html;
    }

    function renderGoals(m) {
      var html = '';
      m.goals.forEach(function(g) {
        var fill = g.type === 'revenue' ? 'background:linear-gradient(90deg,#00ff88,#00cc6a)' :
                   g.type === 'proposals' ? 'background:linear-gradient(90deg,#ff8844,#ff6622)' :
                   g.type === 'win_rate' ? 'background:linear-gradient(90deg,#4488ff,#2266ee)' :
                   'background:linear-gradient(90deg,#aa66ff,#8844dd)';
        var display = g.type === 'revenue' ? '$' + g.current.toLocaleString() + ' / $' + g.target.toLocaleString() :
                      g.type === 'win_rate' ? g.current + '% / ' + g.target + '%' :
                      g.current + ' / ' + g.target;

        html += '<div class="goal-card"><div class="goal-header"><span class="goal-label">' + g.label + '</span>';
        html += '<span class="goal-status ' + g.status + '">' + g.status.replace('-', ' ') + '</span></div>';
        html += '<div class="goal-progress-bar"><div class="goal-progress-fill" style="width:' + g.progress + '%;' + fill + '"></div></div>';
        html += '<div class="goal-stats"><span>' + display + '</span><span>' + g.progress + '%</span></div></div>';
      });
      document.getElementById('goals-grid').innerHTML = html;
    }

    function renderForecast() {
      if (typeof PaymentSimulation === 'undefined') return;
      var forecast = PaymentSimulation.getForecast(6);
      var max = Math.max.apply(null, forecast.forecast.map(function(f) { return f.optimistic; })) || 1;
      var html = '';
      forecast.forecast.forEach(function(f) {
        var conPct = Math.round((f.conservative / max) * 100);
        var projPct = Math.round((f.projected / max) * 100);
        var optPct = Math.round((f.optimistic / max) * 100);
        html += '<div class="forecast-row"><span class="forecast-label">' + f.label + '</span>';
        html += '<div class="forecast-bars" style="flex:1;position:relative;height:20px;background:var(--bg3);border-radius:4px;overflow:hidden">';
        html += '<div class="forecast-bar" style="position:absolute;left:0;top:0;height:100%;width:' + optPct + '%;background:rgba(0,255,136,.1);border-radius:4px"></div>';
        html += '<div class="forecast-bar" style="position:absolute;left:0;top:0;height:100%;width:' + projPct + '%;background:rgba(0,255,136,.25);border-radius:4px"></div>';
        html += '<div class="forecast-bar" style="position:absolute;left:0;top:0;height:100%;width:' + conPct + '%;background:rgba(0,255,136,.5);border-radius:4px"></div>';
        html += '</div>';
        html += '<span class="forecast-val" style="color:var(--green)">$' + f.projected.toLocaleString() + '</span></div>';
      });
      html += '<div style="margin-top:12px;font-size:12px;color:var(--text3)">Projected annual: <strong style="color:var(--green)">$' + forecast.annualProjected.toLocaleString() + '</strong> | Pipeline: $' + forecast.pipelineValue.toLocaleString() + '</div>';
      document.getElementById('forecast-chart').innerHTML = html;
    }

    function renderInsights(m) {
      var html = '';
      if (!m.insights.length) {
        html = '<div class="insight-card info"><span class="insight-icon">📊</span><div class="insight-body"><div class="insight-msg">Start using Cortex to unlock AI-powered insights!</div><div class="insight-action">Submit proposals and track projects to see personalized recommendations.</div></div></div>';
      }
      m.insights.forEach(function(i) {
        html += '<div class="insight-card ' + i.type + '"><span class="insight-icon">' + i.icon + '</span>';
        html += '<div class="insight-body"><div class="insight-msg">' + i.message + '</div>';
        html += '<div class="insight-action">' + (i.action || '') + '</div></div></div>';
      });
      document.getElementById('insights-container').innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
