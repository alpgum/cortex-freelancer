<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a22;--bg4:#222230;
  --text:#f0f0f0;--text2:#b0b0b0;--text3:#666666;
  --orange:#ff8844;--orange2:#ff6622;
  --green:#00ff88;--green2:#00cc6a;
  --red:#ff4444;
  --radius:16px;--radius-sm:10px;
}
html{scroll-behavior:smooth;font-size:16px}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;overflow-x:hidden}
a{color:var(--orange);text-decoration:none;transition:color .2s}
a:hover{color:var(--green)}

nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(20px);background:rgba(10,10,15,.85);border-bottom:1px solid rgba(255,255,255,.05)}
.nav-logo{font-size:1.1rem;font-weight:800;letter-spacing:2px;color:var(--orange);text-decoration:none}
.nav-links{display:flex;gap:1.5rem;align-items:center}
.nav-links a{color:var(--text2);font-size:.85rem;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.nav-links a:hover{color:var(--orange)}

.page-header{padding:6rem 2rem 2rem;text-align:center}
.page-header h1{font-size:clamp(2rem,4vw,3rem);font-weight:900;letter-spacing:-1px;margin-bottom:.5rem}
.page-header h1 span{background:linear-gradient(135deg,var(--orange),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.page-header p{color:var(--text2);font-size:1rem;max-width:560px;margin:0 auto}

.main-wrap{max-width:960px;margin:0 auto;padding:1.5rem 2rem 4rem}

.section{background:var(--bg2);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:1.5rem;margin-bottom:1.5rem}
.section h3{font-size:.75rem;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:1rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.65rem 1.5rem;border-radius:100px;font-size:.85rem;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-secondary{background:var(--bg3);color:var(--text2);border:1px solid rgba(255,255,255,.1)}
.btn-secondary:hover{border-color:var(--orange);color:var(--text)}
.btn-orange{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#000}
.btn-orange:hover{box-shadow:0 6px 20px rgba(255,136,68,.25)}
.btn-green{background:var(--green);color:#000}
.btn-green:hover{box-shadow:0 6px 20px rgba(0,255,136,.25)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

/* Week navigation */
.week-nav{display:flex;align-items:center;justify-content:center;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap}
.week-label{font-size:1.1rem;font-weight:700;color:var(--text);min-width:220px;text-align:center}
.week-btn{background:var(--bg3);border:1px solid rgba(255,255,255,.1);color:var(--text2);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:1rem;transition:all .2s;font-family:inherit}
.week-btn:hover{border-color:var(--orange);color:var(--orange)}

/* Calendar grid */
.cal-grid{display:grid;grid-template-columns:60px repeat(7,1fr);gap:2px;margin-bottom:1.25rem}
.cal-header{background:var(--bg3);padding:.6rem .25rem;text-align:center;border-radius:6px 6px 0 0;font-size:.7rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.cal-header-day{font-size:.85rem;color:var(--text);display:block;margin-top:.15rem;font-weight:800;letter-spacing:0;text-transform:none}
.cal-time{background:var(--bg3);padding:.5rem .4rem;text-align:center;font-size:.72rem;font-weight:600;color:var(--text3);display:grid;place-items:center;border-radius:6px 0 0 6px}
.cal-cell{background:var(--bg3);padding:.5rem;text-align:center;cursor:pointer;transition:all .15s;border:1px solid transparent;min-height:44px;display:grid;place-items:center;font-size:.7rem;color:var(--text3);user-select:none;-webkit-user-select:none}
.cal-cell:hover{border-color:rgba(255,255,255,.15)}
.cal-cell.available{background:rgba(0,255,136,.12);border-color:rgba(0,255,136,.2);color:var(--green)}
.cal-cell.busy{background:rgba(255,68,68,.1);border-color:rgba(255,68,68,.15);color:var(--red)}
.cal-corner{background:var(--bg3);border-radius:6px 0 0 0}

/* Actions */
.cal-actions{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center}

/* Legend */
.legend{display:flex;gap:1.5rem;justify-content:center;margin-bottom:1.25rem;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--text2)}
.legend-swatch{width:16px;height:16px;border-radius:4px}
.legend-swatch.avail{background:rgba(0,255,136,.2);border:1px solid rgba(0,255,136,.3)}
.legend-swatch.busy-swatch{background:rgba(255,68,68,.15);border:1px solid rgba(255,68,68,.2)}

.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg4);color:var(--text);padding:.75rem 1.5rem;border-radius:100px;font-size:.85rem;font-weight:600;transition:transform .3s;z-index:200;border:1px solid rgba(255,255,255,.1)}
.toast.show{transform:translateX(-50%) translateY(0)}

#cortex-auth{display:flex;align-items:center}
.cortex-auth-btn{border:none;cursor:pointer;font-family:inherit;transition:all .2s;border-radius:100px;font-weight:600;font-size:.8rem;letter-spacing:.5px}
.cortex-login-btn{background:var(--orange);color:#000;padding:.45rem 1rem}
.cortex-login-btn:hover{background:var(--green);color:#000}
.cortex-logout-btn{background:var(--bg3);color:var(--text2);padding:.35rem .8rem;font-size:.75rem;border:1px solid rgba(255,255,255,.1)}
.cortex-logout-btn:hover{border-color:var(--orange);color:var(--orange)}
.cortex-user-info{display:flex;align-items:center;gap:.5rem}
.cortex-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover}
.cortex-avatar-placeholder{width:28px;height:28px;border-radius:50%;background:var(--orange);color:#000;display:grid;place-items:center;font-size:.75rem;font-weight:800}
.cortex-user-name{font-size:.8rem;color:var(--text2);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cortex-pro-badge{background:linear-gradient(135deg,var(--green),var(--green2));color:#000;font-size:.6rem;font-weight:800;padding:.15rem .5rem;border-radius:100px;letter-spacing:1px}
@media(max-width:600px){.cortex-user-name{display:none}}

.skip-link{position:absolute;top:-100%;left:1rem;background:var(--orange);color:#000;padding:.75rem 1.5rem;border-radius:8px;font-weight:700;font-size:.9rem;z-index:9999;transition:top .2s}.skip-link:focus{top:1rem}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

footer{text-align:center;padding:2rem;color:var(--text3);font-size:.8rem;border-top:1px solid rgba(255,255,255,.05)}

@media(max-width:640px){
  .page-header h1{font-size:1.7rem}
  .main-wrap{padding:1rem}
  nav{padding:.75rem 1rem}
  .nav-links a:not(.nav-cta){display:none}
  input,select,textarea{font-size:16px}
  button{min-height:44px}
  .cal-grid{gap:1px}
  .cal-header{padding:.4rem .15rem;font-size:.6rem}
  .cal-header-day{font-size:.72rem}
  .cal-time{padding:.35rem .2rem;font-size:.62rem}
  .cal-cell{padding:.3rem;min-height:36px;font-size:.6rem}
  .cal-corner{font-size:.6rem}
  .week-label{font-size:.95rem;min-width:180px}
}

<section class="page-header" id="main-content">
    <h1>Availability <span>Calendar</span></h1>
    <p>Toggle your available time slots and share your schedule with clients via a simple link.</p>
</section>

<div class="main-wrap">
    <div class="section">
        <h3>Weekly Schedule</h3>

        <div class="week-nav">
            <button class="week-btn" id="btn-prev" onclick="changeWeek(-1)" title="Previous week" aria-label="Previous week">&#8592;</button>
            <div class="week-label" id="week-label"></div>
            <button class="week-btn" id="btn-next" onclick="changeWeek(1)" title="Next week" aria-label="Next week">&#8594;</button>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="legend-swatch avail"></div> Available</div>
            <div class="legend-item"><div class="legend-swatch busy-swatch"></div> Busy</div>
        </div>

        <div class="cal-grid" id="cal-grid" role="grid" aria-label="Weekly availability calendar"></div>

        <div class="cal-actions">
            <button class="btn btn-green" onclick="copyShareLink()">&#128279; Copy Share Link</button>
            <button class="btn btn-secondary" onclick="clearAll()" style="color:var(--red)">&#128465; Clear All</button>
        </div>
    </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
var STORAGE_KEY = 'cortex_availability';
var DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var HOURS = [9,10,11,12,13,14,15,16]; // 9 AM to 4 PM
var currentWeekStart = getMonday(new Date());

// State: keyed by "YYYY-MM-DD", value is array of busy hours
// Default: all slots are available (green). Clicking toggles to busy.
var state = loadState();

function getMonday(d){
    var day = d.getDay();
    var diff = d.getDate() - day + (day === 0 ? -6 : 1);
    var mon = new Date(d);
    mon.setDate(diff);
    mon.setHours(0,0,0,0);
    return mon;
}

function formatDate(d){
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + dd;
}

function formatMonthDay(d){
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[d.getMonth()] + ' ' + d.getDate();
}

function getWeekDates(){
    var dates = [];
    for(var i = 0; i < 7; i++){
        var d = new Date(currentWeekStart);
        d.setDate(d.getDate() + i);
        dates.push(d);
    }
    return dates;
}

function loadState(){
    try {
        // Check URL hash first (shared link)
        if(window.location.hash && window.location.hash.length > 1){
            var hashData = window.location.hash.substring(1);
            var decoded = JSON.parse(atob(hashData));
            if(decoded && decoded.weekStart && decoded.busy){
                currentWeekStart = new Date(decoded.weekStart);
                return decoded.busy;
            }
        }
    } catch(e){}
    try {
        var saved = localStorage.getItem(STORAGE_KEY);
        if(saved) return JSON.parse(saved);
    } catch(e){}
    return {};
}

function saveState(){
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch(e){}
}

function isBusy(dateStr, hour){
    return state[dateStr] && state[dateStr].indexOf(hour) !== -1;
}

function toggleSlot(dateStr, hour){
    if(!state[dateStr]) state[dateStr] = [];
    var idx = state[dateStr].indexOf(hour);
    if(idx === -1){
        state[dateStr].push(hour);
    } else {
        state[dateStr].splice(idx, 1);
        if(state[dateStr].length === 0) delete state[dateStr];
    }
    saveState();
    renderGrid();
}

function formatHour(h){
    if(h === 0) return '12 AM';
    if(h < 12) return h + ' AM';
    if(h === 12) return '12 PM';
    return (h - 12) + ' PM';
}

function renderGrid(){
    var dates = getWeekDates();
    var sun = dates[6];
    document.getElementById('week-label').textContent = formatMonthDay(dates[0]) + ' \u2013 ' + formatMonthDay(sun) + ', ' + sun.getFullYear();

    var grid = document.getElementById('cal-grid');
    grid.style.gridTemplateColumns = '60px repeat(7,1fr)';

    var html = '';
    // Corner cell
    html += '<div class="cal-corner"></div>';
    // Day headers
    for(var d = 0; d < 7; d++){
        html += '<div class="cal-header">' + DAY_NAMES[d] + '<span class="cal-header-day">' + dates[d].getDate() + '</span></div>';
    }

    // Time rows
    for(var h = 0; h < HOURS.length; h++){
        var hour = HOURS[h];
        html += '<div class="cal-time">' + formatHour(hour) + '</div>';
        for(var d = 0; d < 7; d++){
            var dateStr = formatDate(dates[d]);
            var busy = isBusy(dateStr, hour);
            var cls = busy ? 'busy' : 'available';
            var label = busy ? 'Busy' : 'Available';
            html += '<div class="cal-cell ' + cls + '" role="gridcell" tabindex="0" aria-label="' + DAY_NAMES[d] + ' ' + formatHour(hour) + ' - ' + label + '" data-date="' + dateStr + '" data-hour="' + hour + '">' + (busy ? '&#10005;' : '&#10003;') + '</div>';
        }
    }

    grid.innerHTML = html;

    // Attach click and keyboard handlers
    var cells = grid.querySelectorAll('.cal-cell');
    for(var i = 0; i < cells.length; i++){
        (function(cell){
            cell.addEventListener('click', function(){
                toggleSlot(cell.getAttribute('data-date'), parseInt(cell.getAttribute('data-hour')));
            });
            cell.addEventListener('keydown', function(e){
                if(e.key === 'Enter' || e.key === ' '){
                    e.preventDefault();
                    toggleSlot(cell.getAttribute('data-date'), parseInt(cell.getAttribute('data-hour')));
                }
            });
        })(cells[i]);
    }
}

function changeWeek(offset){
    currentWeekStart = new Date(currentWeekStart);
    currentWeekStart.setDate(currentWeekStart.getDate() + (offset * 7));
    renderGrid();
}

function copyShareLink(){
    var btn = document.querySelector('.btn-green');
    var origText = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = 'Copying...';

    var weekDates = getWeekDates();
    var weekBusy = {};
    for(var d = 0; d < 7; d++){
        var dateStr = formatDate(weekDates[d]);
        if(state[dateStr] && state[dateStr].length > 0){
            weekBusy[dateStr] = state[dateStr];
        }
    }
    var payload = {
        weekStart: formatDate(currentWeekStart),
        busy: weekBusy
    };
    var encoded = btoa(JSON.stringify(payload));
    var url = window.location.origin + window.location.pathname + '#' + encoded;

    function done(){ btn.disabled = false; btn.innerHTML = origText; }
    if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(function(){
            showToast('Share link copied to clipboard!');
            done();
        }).catch(function(){
            fallbackCopy(url);
            done();
        });
    } else {
        fallbackCopy(url);
        done();
    }
}

function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
        document.execCommand('copy');
        showToast('Share link copied to clipboard!');
    } catch(e){
        showToast('Could not copy link. Check console.');
        console.log('Share link:', text);
    }
    document.body.removeChild(ta);
}

function clearAll(){
    if(!confirm('Clear all availability data? This cannot be undone.')) return;
    state = {};
    localStorage.removeItem(STORAGE_KEY);
    // Clear hash
    if(window.location.hash) history.replaceState(null, '', window.location.pathname);
    renderGrid();
    showToast('All slots cleared');
}

function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

// Init
renderGrid();
dataLayer.push({'event':'tool_used','tool_name':'availability-calendar'});
</script>
