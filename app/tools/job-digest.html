*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth;font-size:16px}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;overflow-x:hidden}

.nav-links{display:flex;gap:1.5rem;align-items:center}

.page-header{padding:6rem 2rem 2rem;text-align:center}
.page-header h1{font-size:clamp(2rem,4vw,3rem);font-weight:900;letter-spacing:-1px;margin-bottom:.5rem}
.page-header h1 span{background:linear-gradient(135deg,var(--orange),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.page-header p{color:var(--text2);font-size:1rem;max-width:560px;margin:0 auto}

.main-wrap{max-width:960px;margin:0 auto;padding:1.5rem 2rem 4rem}

.input-section{background:var(--bg2);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:1.5rem;margin-bottom:1.5rem}
.input-section h3{font-size:.75rem;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:1rem}

.field-group{margin-bottom:1rem}
.field-label{display:block;font-size:.8rem;font-weight:600;color:var(--text2);margin-bottom:.4rem}
.text-input{width:100%;background:var(--bg3);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-sm);padding:.75rem 1rem;color:var(--text);font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s}

.freq-btn.active{background:var(--orange);color:#000;border-color:var(--orange)}
.freq-btn:hover:not(.active){border-color:var(--orange);color:var(--text)}

.btn-row{display:flex;gap:.75rem;margin-top:1rem;flex-wrap:wrap}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.5rem;border-radius:100px;font-size:.9rem;font-weight:700;border:none;cursor:pointer;transition:all .2s;font-family:inherit;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#000;flex:1;min-width:200px}

.digest-body{padding:1.5rem 2rem}

.digest-job-meta{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:.4rem;font-size:.78rem;color:#666}

.digest-job-skills{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.4rem}
.digest-job-skills span{background:#f0f0f5;color:#555;font-size:.7rem;font-weight:600;padding:.15rem .5rem;border-radius:100px}
.digest-footer{background:#f8f8fa;padding:1rem 2rem;text-align:center;font-size:.75rem;color:#999}
.digest-footer a{color:#ff6622}

.digest-label{text-align:center;margin-bottom:1rem}
.digest-label span{display:inline-block;background:var(--bg3);color:var(--text2);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:.4rem 1rem;border-radius:100px;border:1px solid rgba(255,255,255,.08)}

.toast.show{transform:translateX(-50%) translateY(0)}

<section class="page-header" id="main-content">
    <h1>Job <span>Digest</span></h1>
    <p>Preview a daily or weekly email digest of the latest Upwork jobs matching your keywords. Subscribe to stay on top of new opportunities.</p>
</section>

<div class="main-wrap">
    <!-- Keyword & Frequency -->
    <div class="input-section">
        <h3>Digest Settings</h3>
        <div class="field-group">
            <label class="field-label" for="keyword-input">Job Topic / Keyword</label>
            <input type="text" id="keyword-input" class="text-input" placeholder="e.g. react, python, ui design, data science..." onkeydown="if(event.key==='Enter')generatePreview()">
        </div>
        <div class="field-group">
            <label class="field-label">Frequency</label>
            <div class="freq-selector">
                <button class="freq-btn active" data-freq="daily" onclick="setFrequency('daily',this)">Daily</button>
                <button class="freq-btn" data-freq="weekly" onclick="setFrequency('weekly',this)">Weekly</button>
            </div>
        </div>
        <div class="btn-row">
            <button class="btn-primary" id="btn-preview" onclick="generatePreview()">&#128233; Generate Preview</button>
        </div>
    </div>

    <!-- Subscribe -->
    <div class="input-section">
        <h3>Subscribe to Digest</h3>
        <div class="field-group">
            <label class="field-label" for="email-input">Email Address</label>
            <input type="email" id="email-input" class="text-input" placeholder="you@example.com">
        </div>
        <div class="btn-row">
            <button class="btn-primary btn-subscribe" onclick="subscribe()">&#9989; Subscribe</button>
        </div>
        <div id="subscriptions-list" class="sub-list"></div>
    </div>

    <!-- Digest Preview -->
    <div class="digest-preview" id="digest-preview">
        <div class="digest-label"><span>&#128232; Email Preview</span></div>
        <div class="digest-envelope" id="digest-envelope">
            <!-- rendered email content -->
        </div>
    </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
var selectedFrequency = 'daily';

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

function setFrequency(freq, el){
  selectedFrequency = freq;
  var btns = document.querySelectorAll('.freq-btn');
  btns.forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active');
}

/* ---- Subscriptions ---- */
function getSubscriptions(){
  try { return JSON.parse(localStorage.getItem('cortex_job_digests')) || []; }
  catch(e){ return []; }
}

function saveSubscriptions(subs){
  localStorage.setItem('cortex_job_digests', JSON.stringify(subs));
}

function subscribe(){
  var kw = document.getElementById('keyword-input').value.trim();
  var email = document.getElementById('email-input').value.trim();
  if(!kw){ showToast('Enter a keyword first'); return; }
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showToast('Enter a valid email address'); return; }

  var subs = getSubscriptions();
  var exists = subs.some(function(s){ return s.keyword.toLowerCase() === kw.toLowerCase() && s.email.toLowerCase() === email.toLowerCase(); });
  if(exists){ showToast('You are already subscribed to "' + kw + '"'); return; }

  subs.push({
    keyword: kw,
    email: email,
    frequency: selectedFrequency,
    createdAt: new Date().toISOString()
  });
  saveSubscriptions(subs);
  dataLayer.push({'event':'tool_used','tool_name':'job-digest-subscribe'});
  showToast('Subscribed to "' + kw + '" digest!');
  renderSubscriptions();
}

function removeSubscription(idx){
  var subs = getSubscriptions();
  subs.splice(idx, 1);
  saveSubscriptions(subs);
  showToast('Subscription removed');
  renderSubscriptions();
}

function renderSubscriptions(){
  var subs = getSubscriptions();
  var container = document.getElementById('subscriptions-list');
  if(!subs.length){ container.innerHTML = ''; return; }
  var html = '<div style="font-size:.68rem;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.5rem">Active Subscriptions</div>';
  subs.forEach(function(s, i){
    html += '<div class="sub-item">' +
      '<div class="sub-info">' +
        '<span class="sub-keyword">' + esc(s.keyword) + '</span>' +
        '<span class="sub-freq">' + esc(s.frequency) + '</span>' +
        '<span class="sub-email">' + esc(s.email) + '</span>' +
      '</div>' +
      '<button class="sub-remove" onclick="removeSubscription(' + i + ')" title="Remove subscription">&times;</button>' +
    '</div>';
  });
  container.innerHTML = html;
}

/* ---- Digest Preview ---- */
function generatePreview(){
  dataLayer.push({'event':'tool_used','tool_name':'job-digest-preview'});
  var kw = document.getElementById('keyword-input').value.trim();
  if(!kw){ showToast('Enter a keyword to generate a digest'); return; }

  var btn = document.getElementById('btn-preview');
  btn.disabled = true;
  btn.innerHTML = '&#9203; Fetching jobs...';

  var preview = document.getElementById('digest-preview');
  var envelope = document.getElementById('digest-envelope');
  envelope.innerHTML = '<div style="text-align:center;padding:3rem;color:#999;font-size:.9rem">Loading Upwork jobs...</div>';
  preview.classList.add('visible');

  var rssUrl = 'https://www.upwork.com/ab/feed/jobs/rss?q=' + encodeURIComponent(kw) + '&sort=recency';
  var proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(rssUrl);

  fetch(proxyUrl)
    .then(function(res){ return res.text(); })
    .then(function(xml){
      var parser = new DOMParser();
      var doc = parser.parseFromString(xml, 'text/xml');
      var items = doc.querySelectorAll('item');
      if(!items.length){
        envelope.innerHTML = '<div style="text-align:center;padding:3rem;color:#999;font-size:.9rem">No jobs found for "' + esc(kw) + '". Try different keywords.</div>';
        btn.disabled = false;
        btn.innerHTML = '&#128233; Generate Preview';
        return;
      }

      var jobs = [];
      var count = Math.min(items.length, 15);
      for(var i = 0; i < count; i++){
        var item = items[i];
        var title = (item.querySelector('title') || {}).textContent || 'Untitled';
        var link = (item.querySelector('link') || {}).textContent || '';
        var desc = (item.querySelector('description') || {}).textContent || '';
        var pubDate = (item.querySelector('pubDate') || {}).textContent || '';

        var div = document.createElement('div');
        div.innerHTML = desc;
        var descText = div.textContent || div.innerText || '';

        var budget = '';
        var bMatch = descText.match(/Budget[:\s]*\$[\d,]+\s*[-\u2013]?\s*\$?[\d,]*/i);
        if(bMatch) budget = bMatch[0];
        if(!budget){
          bMatch = descText.match(/Hourly Range[:\s]*\$[\d.]+\s*[-\u2013]\s*\$[\d.]+/i);
          if(bMatch) budget = bMatch[0];
        }
        if(!budget){
          bMatch = descText.match(/Fixed.Price[:\s]*\$[\d,]+/i);
          if(bMatch) budget = bMatch[0];
        }

        var skills = [];
        var skillMatch = descText.match(/Skills[:\s]*(.+?)(?:\n|$)/i);
        if(skillMatch){
          skills = skillMatch[1].split(/[,\u2022\|]/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 1 && s.length < 40; }).slice(0, 8);
        }

        var posted = '';
        if(pubDate){
          var d = new Date(pubDate);
          var now = new Date();
          var diffH = Math.round((now - d) / 3600000);
          if(diffH < 1) posted = 'Just now';
          else if(diffH < 24) posted = diffH + 'h ago';
          else posted = Math.round(diffH / 24) + 'd ago';
        }

        jobs.push({title:title, link:link, budget:budget, skills:skills, posted:posted});
      }

      renderDigest(jobs, kw);
      btn.disabled = false;
      btn.innerHTML = '&#128233; Generate Preview';
    })
    .catch(function(err){
      envelope.innerHTML = '<div style="text-align:center;padding:3rem;color:#999;font-size:.9rem">Could not fetch jobs. The RSS feed may be temporarily unavailable. Try again later.</div>';
      btn.disabled = false;
      btn.innerHTML = '&#128233; Generate Preview';
    });
}

function renderDigest(jobs, keyword){
  var envelope = document.getElementById('digest-envelope');
  var now = new Date();
  var dateStr = now.toLocaleDateString('en-US', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  var freqLabel = selectedFrequency === 'weekly' ? 'Weekly' : 'Daily';

  var html = '<div class="digest-header">' +
    '<h2>Your ' + freqLabel + ' Job Digest</h2>' +
    '<p>' + esc(keyword) + ' jobs &mdash; ' + esc(dateStr) + '</p>' +
  '</div>' +
  '<div class="digest-body">';

  if(!jobs.length){
    html += '<p style="color:#999;text-align:center;padding:2rem 0">No matching jobs found.</p>';
  } else {
    jobs.forEach(function(job){
      html += '<div class="digest-job">';
      html += '<div class="digest-job-title">';
      if(job.link){
        html += '<a href="' + esc(job.link) + '" target="_blank" rel="noopener">' + esc(job.title) + '</a>';
      } else {
        html += esc(job.title);
      }
      html += '</div>';
      html += '<div class="digest-job-meta">';
      if(job.budget) html += '<span>&#128176; ' + esc(job.budget) + '</span>';
      if(job.posted) html += '<span>&#128337; ' + esc(job.posted) + '</span>';
      html += '</div>';
      if(job.skills.length){
        html += '<div class="digest-job-skills">';
        job.skills.forEach(function(sk){
          html += '<span>' + esc(sk) + '</span>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
  }

  html += '</div>' +
    '<div class="digest-footer">' +
      'You are receiving this because you subscribed to <strong>' + esc(keyword) + '</strong> ' + freqLabel.toLowerCase() + ' digests on ' +
      '<a href="https://cortexfreelancer.com">Cortex Freelancer</a>.' +
    '</div>';

  envelope.innerHTML = html;
  var preview = document.getElementById('digest-preview');
  preview.scrollIntoView({behavior:'smooth', block:'start'});
}

/* Init */
document.addEventListener('DOMContentLoaded', function(){
  renderSubscriptions();
});
</script>

<script>
/* [604] Auto-fill from Upwork profile */
(function(){
  function addLabel(el){
    if(!el||el.parentNode.querySelector('.upwork-prefill-label'))return;
    var lbl=document.createElement('span');
    lbl.className='upwork-prefill-label';
    lbl.textContent='From your profile';
    lbl.style.cssText='display:inline-block;font-size:0.72rem;color:var(--green2,#00cc6a);background:rgba(0,255,136,0.08);padding:2px 8px;border-radius:6px;margin-top:4px;font-weight:500';
    el.parentNode.appendChild(lbl);
  }
  function prefill(){
    var storage=window.cortexUpworkStorage;
    if(!storage)return;
    var rec=storage.loadSync();
    if(!rec||!rec.data)return;
    var d=rec.data;
    if(d.skills&&d.skills.length){
      var el=document.getElementById('keyword-input');
      if(el&&!el.value){
        // Pick top 3 skills as comma-separated keywords
        var kw=d.skills.slice(0,3).join(', ');
        el.value=kw;
        addLabel(el);
      }
    }
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',prefill);}else{prefill();}
})();
</script>
<script defer src="js/cross-linker.js"></script>
</body>
</html>
