<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Discovery — Cortex Freelancer</title>
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/shared/css/navigation.css">
  <style>
    :root{--bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a22;--bg4:#222230;--text:#f0f0f0;--text2:#b0b0b0;--text3:#666;--orange:#ff8844;--green:#00ff88;--red:#ff4444;--yellow:#ffc800;--blue:#4488ff;--purple:#aa66ff;--radius:16px}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;line-height:1.6}
    .page{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
    .page-header h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,#ff8844,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
    .page-header p{color:var(--text3);font-size:14px;margin-bottom:20px}

    /* Filters */
    .filters{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
    .filter-input{background:var(--bg2);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 16px;color:var(--text);font-size:14px;outline:none;flex:1;min-width:200px}
    .filter-input:focus{border-color:var(--orange)}
    .filter-select{background:var(--bg2);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 16px;color:var(--text);font-size:14px;cursor:pointer;outline:none}
    .filter-btn{background:var(--orange);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer}

    /* Job Cards */
    .job-grid{display:flex;flex-direction:column;gap:14px}
    .job-card{background:var(--bg2);border:1px solid rgba(255,255,255,.05);border-radius:var(--radius);padding:24px;transition:border-color .2s;cursor:pointer}
    .job-card:hover{border-color:rgba(255,136,68,.3)}
    .job-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}
    .job-title{font-size:17px;font-weight:700;color:var(--text);line-height:1.3}
    .job-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;white-space:nowrap}
    .badge-high{background:rgba(255,68,68,.15);color:var(--red)}
    .badge-medium{background:rgba(255,200,0,.15);color:var(--yellow)}
    .badge-low{background:rgba(0,255,136,.15);color:var(--green)}
    .job-desc{font-size:14px;color:var(--text2);margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .job-skills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
    .skill-tag{background:var(--bg3);color:var(--text2);font-size:12px;padding:4px 10px;border-radius:6px;font-weight:500}
    .job-meta{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--text3)}
    .job-meta strong{color:var(--text2)}
    .job-actions{display:flex;gap:10px;margin-top:14px}
    .btn-propose{background:linear-gradient(135deg,#ff8844,#ff6622);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .2s}
    .btn-propose:hover{transform:scale(1.02)}
    .btn-save{background:var(--bg3);color:var(--text2);border:1px solid rgba(255,255,255,.1);padding:10px 16px;border-radius:10px;font-size:14px;cursor:pointer}
    .job-client{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text3)}
    .client-stars{color:var(--yellow)}
    .verified-badge{color:var(--green);font-size:11px}

    /* Match Score */
    .match-score{display:flex;align-items:center;gap:6px}
    .match-ring{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:2px solid}
    .match-high{border-color:var(--green);color:var(--green)}
    .match-med{border-color:var(--yellow);color:var(--yellow)}
    .match-low{border-color:var(--text3);color:var(--text3)}

    /* Stats */
    .stats-bar{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
    .stat{background:var(--bg2);border-radius:10px;padding:12px 20px;font-size:13px}
    .stat strong{color:var(--orange);font-weight:700}

    /* Loading */
    .loading{text-align:center;padding:60px;color:var(--text3)}
    .empty{text-align:center;padding:60px;color:var(--text3)}
    .empty h3{font-size:18px;color:var(--text2);margin-bottom:8px}

    /* Proposal Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.show{display:flex}
    .modal{background:var(--bg2);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto}
    .modal h2{font-size:20px;font-weight:800;margin-bottom:16px}
    .modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text3);font-size:24px;cursor:pointer}
    .proposal-content{background:var(--bg3);border-radius:12px;padding:20px;margin:16px 0;font-size:14px;color:var(--text2);line-height:1.8;white-space:pre-wrap}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  </style>
</head>
<body>
  <main class="page">
    <div class="page-header">
      <h1>🔍 Job Discovery</h1>
      <p>AI-curated freelance jobs matched to your skills</p>
    </div>

    <div class="filters">
      <input type="text" class="filter-input" id="search-input" placeholder="Search jobs...">
      <select class="filter-select" id="category-filter">
        <option value="">All Categories</option>
        <option value="web-dev">Web Development</option>
        <option value="design">Design</option>
        <option value="writing">Writing</option>
        <option value="marketing">Marketing</option>
        <option value="data-entry">Data Entry</option>
        <option value="mobile">Mobile Dev</option>
        <option value="devops">DevOps</option>
        <option value="ai-ml">AI/ML</option>
      </select>
      <select class="filter-select" id="sort-filter">
        <option value="posted_desc">Newest First</option>
        <option value="budget_desc">Highest Budget</option>
        <option value="competition_asc">Least Competition</option>
      </select>
      <button class="filter-btn" onclick="loadJobs()">Search</button>
    </div>

    <div class="stats-bar" id="stats-bar"></div>
    <div class="job-grid" id="job-grid"><div class="loading">Loading jobs...</div></div>

    <div style="text-align:center;margin-top:24px">
      <a href="dashboard.html" style="color:var(--orange);font-weight:600">← Back to Dashboard</a>
    </div>
  </main>

  <!-- Proposal Modal -->
  <div class="modal-overlay" id="proposal-modal">
    <div class="modal" style="position:relative">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <h2 id="modal-title">Generate Proposal</h2>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="js/demo-workflow.js"></script>
  <script src="js/ai-memory-system.js"></script>
  <script>
    var allJobs = [];
    var selectedJob = null;

    async function loadJobs() {
      var search = document.getElementById('search-input').value;
      var category = document.getElementById('category-filter').value;
      var sort = document.getElementById('sort-filter').value;

      var grid = document.getElementById('job-grid');
      grid.innerHTML = '<div class="loading">Searching...</div>';

      try {
        var params = new URLSearchParams();
        if (search) params.set('search', search);
        if (category) params.set('category', category);
        params.set('sort', sort);
        params.set('limit', '50');

        var resp = await fetch('/api/jobs?' + params.toString());
        var data = await resp.json();
        if (data.success) {
          allJobs = data.data;
          renderStats(data);
          renderJobs(allJobs);
        } else {
          throw new Error('API error');
        }
      } catch(e) {
        // Fallback to demo workflow
        if (typeof DemoWorkflow !== 'undefined') {
          allJobs = await DemoWorkflow.fetchJobs({ search: search, category: category });
          renderJobs(allJobs);
        } else {
          grid.innerHTML = '<div class="empty"><h3>Unable to load jobs</h3><p>Check your connection and try again.</p></div>';
        }
      }
    }

    function renderStats(data) {
      if (!data.pagination) return;
      var html = '<div class="stat"><strong>' + data.pagination.total + '</strong> jobs found</div>';
      if (data.categories) {
        Object.entries(data.categories).slice(0, 4).forEach(function(e) {
          html += '<div class="stat">' + e[0] + ': <strong>' + e[1] + '</strong></div>';
        });
      }
      document.getElementById('stats-bar').innerHTML = html;
    }

    function renderJobs(jobs) {
      var grid = document.getElementById('job-grid');
      if (!jobs.length) {
        grid.innerHTML = '<div class="empty"><h3>No jobs found</h3><p>Try adjusting your filters.</p></div>';
        return;
      }

      grid.innerHTML = jobs.map(function(job) {
        var budget = job.budget || {};
        var budgetStr = budget.type === 'hourly' ? '$' + budget.min + '-' + budget.max + '/hr' :
                        budget.type === 'monthly' ? '$' + budget.min.toLocaleString() + '-' + budget.max.toLocaleString() + '/mo' :
                        '$' + (budget.min || 0).toLocaleString() + '-' + (budget.max || 0).toLocaleString();
        var urgClass = job.urgency === 'high' ? 'badge-high' : job.urgency === 'medium' ? 'badge-medium' : 'badge-low';
        var matchScore = 70 + Math.floor(Math.random() * 25);
        var matchClass = matchScore >= 85 ? 'match-high' : matchScore >= 70 ? 'match-med' : 'match-low';
        var stars = job.client ? '★'.repeat(Math.round(job.client.rating || 4)) : '';

        return '<div class="job-card" onclick="selectJob(\'' + job.id + '\')">' +
          '<div class="job-top"><div style="flex:1"><div class="job-title">' + job.title + '</div>' +
          '<div class="job-client">' + (job.client ? job.client.name : 'Client') + ' <span class="client-stars">' + stars + '</span>' +
          (job.client && job.client.verified ? ' <span class="verified-badge">✓ Verified</span>' : '') + '</div></div>' +
          '<div style="display:flex;gap:8px;align-items:center"><div class="match-ring ' + matchClass + '">' + matchScore + '</div>' +
          '<span class="job-badge ' + urgClass + '">' + (job.urgency || 'medium') + '</span></div></div>' +
          '<div class="job-desc">' + job.description + '</div>' +
          '<div class="job-skills">' + (job.skills || []).map(function(s) { return '<span class="skill-tag">' + s + '</span>'; }).join('') + '</div>' +
          '<div class="job-meta"><span>💰 <strong>' + budgetStr + '</strong></span>' +
          '<span>⏱ ' + (job.duration || 'Flexible') + '</span>' +
          '<span>📋 ' + (job.competition ? job.competition.proposals + ' proposals' : 'New') + '</span>' +
          '<span>📍 ' + (job.client ? job.client.location : 'Remote') + '</span></div>' +
          '<div class="job-actions"><button class="btn-propose" onclick="event.stopPropagation();generateProposal(\'' + job.id + '\')">✨ Generate Proposal</button>' +
          '<button class="btn-save" onclick="event.stopPropagation()">☆ Save</button></div></div>';
      }).join('');
    }

    function selectJob(jobId) {
      var job = allJobs.find(function(j) { return j.id === jobId; });
      if (job && typeof DemoWorkflow !== 'undefined') {
        DemoWorkflow.selectJob(job);
      }
    }

    async function generateProposal(jobId) {
      var job = allJobs.find(function(j) { return j.id === jobId; });
      if (!job) return;

      selectedJob = job;
      var modal = document.getElementById('proposal-modal');
      document.getElementById('modal-title').textContent = '✨ AI Proposal for: ' + job.title;
      document.getElementById('modal-content').innerHTML = '<div class="loading">Generating AI proposal...</div>';
      modal.classList.add('show');

      if (typeof DemoWorkflow !== 'undefined') {
        var proposal = await DemoWorkflow.generateProposal(job);
        var content = proposal.content;
        var text = content.greeting + '\n\n' + content.hook + '\n\n' + content.experience + '\n\n' + content.approach + '\n\n' + content.timeline + '\n\n' + content.closing + '\n\n' + content.callToAction;

        document.getElementById('modal-content').innerHTML =
          '<div style="display:flex;gap:12px;margin-bottom:16px;font-size:13px">' +
          '<span style="background:var(--bg3);padding:4px 10px;border-radius:6px">💰 Rate: $' + proposal.rate.effective + '/hr</span>' +
          '<span style="background:var(--bg3);padding:4px 10px;border-radius:6px">⏱ ' + proposal.estimatedHours + ' hours</span>' +
          '<span style="background:var(--bg3);padding:4px 10px;border-radius:6px">📊 Match: ' + proposal.metadata.matchScore + '%</span></div>' +
          '<div class="proposal-content">' + text + '</div>' +
          '<div class="modal-actions">' +
          '<button class="btn-save" onclick="simulateResponse(\'' + proposal.id + '\')">🎲 Simulate Response</button>' +
          '<button class="btn-save" onclick="copyProposal()">📋 Copy</button>' +
          '<button class="btn-propose" onclick="closeModal()">Done</button></div>';
      }
    }

    function simulateResponse(proposalId) {
      if (typeof DemoWorkflow !== 'undefined') {
        var result = DemoWorkflow.simulateResponse(proposalId);
        if (result) {
          var statusColors = { accepted: 'var(--green)', interview: 'var(--blue)', negotiation: 'var(--yellow)', declined: 'var(--red)' };
          var color = statusColors[result.response.status] || 'var(--text)';
          document.getElementById('modal-content').innerHTML +=
            '<div style="margin-top:16px;background:var(--bg3);border-left:3px solid ' + color + ';padding:16px;border-radius:0 10px 10px 0">' +
            '<div style="font-size:12px;color:' + color + ';font-weight:700;text-transform:uppercase;margin-bottom:6px">Client Response: ' + result.response.status + '</div>' +
            '<div style="font-size:14px;color:var(--text2)">"' + result.response.message + '"</div></div>';
        }
      }
    }

    function copyProposal() {
      var el = document.querySelector('.proposal-content');
      if (el) {
        navigator.clipboard.writeText(el.textContent);
        alert('Proposal copied to clipboard!');
      }
    }

    function closeModal() {
      document.getElementById('proposal-modal').classList.remove('show');
    }

    document.getElementById('search-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') loadJobs();
    });

    document.addEventListener('DOMContentLoaded', loadJobs);
  </script>
</body>
</html>
