<meta name="description" content="Manage your freelance clients with full profiles, project history, payment terms, and export to CSV/PDF. Free tool by Cortex Freelancer.">
<meta property="og:title" content="Free Client Directory for Freelancers">
<meta property="og:description" content="Complete client management with profiles, project history, billing, and data export.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://cortexfreelancer.com/app/tools/client-directory">
<meta property="og:image" content="https://cortexfreelancer.com/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Free Client Directory for Freelancers">
<meta name="twitter:description" content="Complete client management with profiles, project history, billing, and data export.">
<meta name="twitter:image" content="https://cortexfreelancer.com/og-image.png">

</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NDV9WQ7" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<!-- NAV -->
<nav>
  <a href="/" class="nav-logo">CORTEX</a>
  <div class="nav-links">
    <a href="/app/tools/">Tools</a>
    <a href="/app/tools/client-crm">CRM</a>
    <a href="/app/tools/invoice">Invoice</a>
    <a href="/app/tools/proposal">Proposals</a>
  </div>
</nav>

<!-- HEADER -->
<div class="page-header">
  <h1>Client <span>Directory</span></h1>
  <p>Full client lifecycle management — contacts, projects, billing, and export. All stored locally.</p>
</div>

<!-- MAIN -->
<div class="main-wrap">

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-val blue" id="statTotal">0</div>
      <div class="stat-label">Total Clients</div>
    </div>
    <div class="stat-card">
      <div class="stat-val green" id="statActive">0</div>
      <div class="stat-label">Active</div>
    </div>
    <div class="stat-card">
      <div class="stat-val yellow" id="statProspects">0</div>
      <div class="stat-label">Prospects</div>
    </div>
    <div class="stat-card">
      <div class="stat-val green" id="statRevenue">$0</div>
      <div class="stat-label">Total Revenue</div>
    </div>
    <div class="stat-card">
      <div class="stat-val orange" id="statAvgRate">—</div>
      <div class="stat-label">Avg Rate</div>
    </div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <input type="text" id="searchInput" class="search-input" placeholder="Search clients by name, email, company, tags…">
    <select id="filterStatus" class="filter-select">
      <option value="">All Status</option>
      <option value="active">Active</option>
      <option value="prospect">Prospect</option>
      <option value="inactive">Inactive</option>
      <option value="archived">Archived</option>
    </select>
    <select id="filterType" class="filter-select">
      <option value="">All Types</option>
      <option value="SaaS">SaaS</option>
      <option value="E-commerce">E-commerce</option>
      <option value="Startup">Startup</option>
      <option value="Agency">Agency</option>
      <option value="Mobile Development">Mobile</option>
      <option value="Web Development">Web Dev</option>
      <option value="Design">Design</option>
      <option value="AI/ML">AI/ML</option>
    </select>
    <select id="sortBy" class="filter-select">
      <option value="newest">Newest First</option>
      <option value="oldest">Oldest First</option>
      <option value="name">Name A→Z</option>
      <option value="revenue">Highest Revenue</option>
      <option value="rate">Highest Rate</option>
    </select>
    <button class="btn btn-orange" id="btnAddClient">+ Add Client</button>
    <div class="export-menu">
      <button class="btn btn-secondary" id="btnExport">↓ Export</button>
      <div class="export-dropdown" id="exportDropdown">
        <button class="export-option" id="exportCSV"><span class="eo-icon">📄</span> Export as CSV</button>
        <button class="export-option" id="exportPDF"><span class="eo-icon">📋</span> Export as PDF (Print)</button>
      </div>
    </div>
  </div>

  <!-- CLIENT GRID -->
  <div class="clients-grid" id="clientsGrid">
    <!-- Rendered by JS -->
  </div>

</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Add New Client</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body">
      <form id="clientForm" onsubmit="return false">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Name *</label>
            <input type="text" id="fName" class="form-input" placeholder="Client name" required>
          </div>
          <div class="form-group">
            <label class="form-label">Company</label>
            <input type="text" id="fCompany" class="form-input" placeholder="Company name">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" id="fEmail" class="form-input" placeholder="email@example.com">
          </div>
          <div class="form-group">
            <label class="form-label">Phone</label>
            <input type="tel" id="fPhone" class="form-input" placeholder="+1 555-0123">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Status</label>
            <select id="fStatus" class="form-select">
              <option value="prospect">Prospect</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
              <option value="archived">Archived</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Hourly Rate ($)</label>
            <input type="number" id="fRate" class="form-input" placeholder="150" min="0" step="5">
          </div>
          <div class="form-group">
            <label class="form-label">Payment Terms</label>
            <select id="fPayTerms" class="form-select">
              <option value="immediate">Due on Receipt</option>
              <option value="net15">Net 15</option>
              <option value="net30" selected>Net 30</option>
              <option value="net45">Net 45</option>
              <option value="net60">Net 60</option>
              <option value="milestone">Milestone-based</option>
              <option value="custom">Custom</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Website</label>
            <input type="url" id="fWebsite" class="form-input" placeholder="https://example.com">
          </div>
          <div class="form-group">
            <label class="form-label">Tags (comma-separated)</label>
            <input type="text" id="fTags" class="form-input" placeholder="SaaS, React, Long-term">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group full">
            <label class="form-label">Address</label>
            <input type="text" id="fAddress" class="form-input" placeholder="City, Country">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group full">
            <label class="form-label">Notes</label>
            <textarea id="fNotes" class="form-textarea" placeholder="Communication preferences, important details…"></textarea>
          </div>
        </div>

        <!-- PROJECT HISTORY -->
        <div class="projects-section">
          <h4>
            <span>📁 Project History</span>
          </h4>
          <div class="project-add">
            <div class="form-group" style="min-width:160px">
              <label class="form-label">Project Name</label>
              <input type="text" id="fpName" class="form-input" placeholder="Project name">
            </div>
            <div class="form-group" style="min-width:100px">
              <label class="form-label">Amount ($)</label>
              <input type="number" id="fpAmount" class="form-input" placeholder="5000" min="0">
            </div>
            <div class="form-group" style="min-width:130px">
              <label class="form-label">Type</label>
              <select id="fpType" class="form-select">
                <option value="Web Development">Web Development</option>
                <option value="Mobile Development">Mobile Development</option>
                <option value="Design">Design</option>
                <option value="E-commerce">E-commerce</option>
                <option value="Consulting">Consulting</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group" style="min-width:110px">
              <label class="form-label">Status</label>
              <select id="fpStatus" class="form-select">
                <option value="active">Active</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
            <button type="button" class="btn btn-green btn-sm" id="btnAddProject" style="align-self:flex-end;margin-bottom:1px">+ Add</button>
          </div>
          <div id="projectsList"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="btnCancelClient">Cancel</button>
      <button class="btn btn-orange" id="btnSaveClient">💾 Save Client</button>
    </div>
  </div>
</div>

<!-- DETAIL SLIDE PANEL -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-panel">
    <div class="detail-header">
      <div>
        <h2 id="detailName">Client Name</h2>
        <span class="client-status" id="detailStatus">ACTIVE</span>
      </div>
      <button class="modal-close" id="detailClose">✕</button>
    </div>
    <div class="detail-body" id="detailBody">
      <!-- Rendered by JS -->
    </div>
    <div class="detail-actions" id="detailActions">
      <!-- Rendered by JS -->
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- CORE JS -->
<script src="js/client-core.js"></script>

<!-- Sentry -->
<script src="https://browser.sentry-cdn.com/7.64.0/bundle.tracing.replay.min.js" crossorigin="anonymous" defer></script>
</body>
</html>
