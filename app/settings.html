<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a22;--bg4:#222230;
  --text:#f0f0f0;--text2:#b0b0b0;--text3:#666666;
  --orange:#ff8844;--orange2:#ff6622;
  --green:#00ff88;--green2:#00cc6a;
  --red:#ff4444;
  --radius:16px;--radius-sm:10px;
}
html{scroll-behavior:smooth;font-size:16px}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;overflow-x:hidden}
a{color:var(--orange);text-decoration:none;transition:color .2s}
a:hover{color:var(--green)}

nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(20px);background:rgba(10,10,15,.85);border-bottom:1px solid rgba(255,255,255,.05)}
.nav-logo{font-size:1.1rem;font-weight:800;letter-spacing:2px;color:var(--orange);text-decoration:none}
.nav-links{display:flex;gap:1.5rem;align-items:center}
.nav-links a{color:var(--text2);font-size:.85rem;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.nav-links a:hover{color:var(--orange)}

/* Photo Upload */
.photo-wrap{display:flex;align-items:center;gap:1.25rem;margin-bottom:1.25rem}
.avatar-circle{width:72px;height:72px;border-radius:50%;background:var(--bg3);border:2px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;font-size:1.8rem;color:var(--text3)}
.avatar-circle img{width:100%;height:100%;object-fit:cover}
.photo-actions{display:flex;flex-direction:column;gap:.4rem}
.photo-actions .btn-secondary{font-size:.78rem;padding:.4rem 1rem}

/* Working hours grid */
.hours-grid{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:.5rem .75rem;align-items:center}
.hours-grid .day-label{font-size:.82rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.3px}
.hours-grid .form-input{padding:.5rem .7rem;font-size:.82rem}
.hours-grid .toggle-switch{justify-self:end}

/* Danger zone */
.danger-card{border-color:rgba(255,68,68,.2)}
.danger-card h3{color:var(--red)}
.danger-card h3 svg{color:var(--red)}

/* Storage meter */
.storage-meter{height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;margin:.75rem 0 .25rem}
.storage-meter-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--orange));border-radius:4px;transition:width .3s}
.storage-label{font-size:.75rem;color:var(--text3)}

/* Loading state */
.settings-loading{text-align:center;padding:6rem 2rem;color:var(--text3)}
.settings-loading .spinner{width:32px;height:32px;border:3px solid var(--bg3);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->

<nav>
  <a href="/app/dashboard.html" class="nav-logo">CORTEX</a>
  <div class="nav-links">
    <a href="/app/dashboard.html">Dashboard</a>
    <a href="/app/tools/time-tracker.html">Tools</a>
    <a href="#" id="nav-auth-btn" class="nav-cta" style="background:var(--orange);color:#000;padding:.5rem 1.2rem;border-radius:100px;font-weight:700;font-size:.8rem;letter-spacing:.5px;text-transform:uppercase;transition:all .2s">Sign In</a>
  </div>
</nav>

<div class="settings-page" id="settings-root">
  <div class="settings-loading" id="settings-loader">
    <div class="spinner"></div>
    <p>Loading settings...</p>
  </div>
</div>

<!-- Toast notification -->
<div class="settings-toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toast-msg">Saved</span>
</div>

<!-- Save bar -->
<div class="save-bar" id="save-bar">
  <div class="save-info"><strong>Unsaved changes</strong> — your settings have been modified</div>
  <div class="save-actions">
    <button class="btn-secondary" id="btn-discard">Discard</button>
    <button class="btn-primary" id="btn-save">Save Changes</button>
  </div>
</div>

<!-- Hidden file input for photo -->
<input type="file" id="photo-file" accept="image/*" style="display:none">
<!-- Hidden file input for import -->
<input type="file" id="import-file" accept=".json" style="display:none">
