<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelancer Score — Cortex Freelancer</title>
  <meta name="description" content="Check out this Freelancer Score from Cortex — instant AI analysis for freelancers.">
  <meta property="og:title" content="Freelancer Score — Cortex Freelancer">
  <meta property="og:description" content="Get your own Freelancer Score. Instant AI analysis of your profile, job matches, and payment optimization.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Freelancer Score — Cortex Freelancer">
  <meta name="twitter:description" content="Get your own Freelancer Score. Instant AI profile analysis.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0a0a0a; --card:#111; --border:#222; --text:#e0e0e0; --dim:#888; --bright:#fff; --orange:#ff8844; --green:#00ff88; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;-webkit-font-smoothing:antialiased}
    .share-page{display:flex;flex-direction:column;align-items:center;gap:2rem;max-width:480px;width:100%;text-align:center}
    .score-canvas-wrap{width:100%;max-width:400px}
    .score-canvas-wrap canvas{width:100%;border-radius:12px;border:1px solid var(--border)}
    h2{font-size:1.3rem;font-weight:700;color:var(--bright)}
    p.sub{color:var(--dim);font-size:0.9rem;line-height:1.5}
    .cta-btn{
      display:inline-flex;align-items:center;gap:0.5rem;
      background:linear-gradient(135deg,var(--orange),#ff6622);
      color:#fff;padding:0.9rem 2rem;border-radius:10px;
      font-size:1rem;font-weight:700;border:none;cursor:pointer;
      text-decoration:none;transition:all 0.2s;
    }
    .cta-btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
    .powered{font-size:0.7rem;color:var(--dim)}
    .powered a{color:var(--orange);text-decoration:none}
  </style>
</head>
<body>
  <div class="share-page">
    <div class="score-canvas-wrap">
      <canvas id="score-canvas" width="1080" height="1080"></canvas>
    </div>
    <h2>Get your own Freelancer Score</h2>
    <p class="sub">Instant AI analysis of your profile — find better jobs, optimize your rate, and stop losing money on fees.</p>
    <a class="cta-btn" href="index.html">Analyze My Profile &rarr;</a>
    <p class="powered">Powered by <a href="index.html">Cortex Freelancer</a></p>
  </div>

  <script>
    var SKILL_LABELS={"web-development":"Web Dev","mobile-development":"Mobile Dev","design":"Design","writing":"Writing","data-science":"Data Science","devops":"DevOps","marketing":"Marketing","video":"Video","blockchain":"Blockchain","qa":"QA"};
    var COUNTRY_LABELS={egypt:"Egypt",turkey:"Turkey",pakistan:"Pakistan",india:"India",nigeria:"Nigeria",philippines:"Philippines",brazil:"Brazil",mexico:"Mexico",ukraine:"Ukraine",kenya:"Kenya",us:"USA",uk:"UK",eu:"Europe"};
    function fmt$(n){return '$'+n.toLocaleString('en-US');}

    // Parse data from hash or query params (backwards compat)
    var data=null;
    if(location.hash.length>1){
      try{data=JSON.parse(atob(location.hash.slice(1)));}catch(e){}
    }
    if(!data){
      var p=new URLSearchParams(location.search);
      data={s:parseFloat(p.get('score'))||0,sk:p.get('skills')||'',c:p.get('country')||'',sv:parseInt(p.get('savings'))||0,r:0,bm:0,h:7,o:7,ss:7,p:7,rs:7};
    }

    document.title='Freelancer Score: '+(data.s||0).toFixed?data.s.toFixed(1):'0'+'/10 — Cortex';

    function roundRect(ctx,x,y,w,h,r){
      ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
      ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
      ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
    }

    var canvas=document.getElementById('score-canvas');
    var ctx=canvas.getContext('2d'),W=1080,H=1080;
    var score=data.s||0;

    var bg=ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,'#0a0a0a');bg.addColorStop(1,'#111111');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

    var glow=ctx.createRadialGradient(W*0.8,H*0.15,0,W*0.8,H*0.15,400);
    glow.addColorStop(0,'rgba(0,255,136,0.06)');glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);

    ctx.strokeStyle='#222';ctx.lineWidth=3;roundRect(ctx,20,20,W-40,H-40,24);ctx.stroke();

    ctx.fillStyle='#ff8844';ctx.font='bold 28px Inter, sans-serif';
    ctx.fillText('CORTEX FREELANCER',80,100);
    ctx.fillStyle='#444';ctx.font='22px Inter, sans-serif';ctx.textAlign='right';
    ctx.fillText('Freelancer Score',W-80,100);ctx.textAlign='left';

    var cx=W/2,cy=340,rad=140;
    ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.strokeStyle='#222';ctx.lineWidth=20;ctx.stroke();
    var scoreAngle=(score/10)*Math.PI*2;
    var grad=ctx.createLinearGradient(cx-rad,cy,cx+rad,cy);
    grad.addColorStop(0,'#ff8844');grad.addColorStop(1,'#00ff88');
    ctx.beginPath();ctx.arc(cx,cy,rad,-Math.PI/2,-Math.PI/2+scoreAngle);ctx.strokeStyle=grad;ctx.lineWidth=20;ctx.lineCap='round';ctx.stroke();ctx.lineCap='butt';

    ctx.fillStyle='#ffffff';ctx.font='bold 96px Inter, sans-serif';ctx.textAlign='center';
    ctx.fillText(score.toFixed(1),cx,cy+20);
    ctx.fillStyle='#888';ctx.font='36px Inter, sans-serif';
    ctx.fillText('/10',cx,cy+65);

    var topY=540;
    ctx.fillStyle='#00ff88';ctx.font='bold 26px Inter, sans-serif';ctx.textAlign='left';
    ctx.fillText('TOP SKILLS',80,topY);
    var skills=[{l:'Headline',v:data.h||7},{l:'Overview',v:data.o||7},{l:'Skills',v:data.ss||7},{l:'Portfolio',v:data.p||7},{l:'Rate',v:data.rs||7}];
    skills.forEach(function(s,i){
      var sy=topY+50+i*60;
      ctx.fillStyle='#e0e0e0';ctx.font='24px Inter, sans-serif';ctx.textAlign='left';
      ctx.fillText(s.l,80,sy);
      ctx.fillStyle='#1a1a1a';roundRect(ctx,280,sy-16,560,22,6);ctx.fill();
      var bw=560*(s.v/10);
      var barGrad=ctx.createLinearGradient(280,0,280+bw,0);
      barGrad.addColorStop(0,'#ff8844');barGrad.addColorStop(1,'#00ff88');
      ctx.fillStyle=barGrad;roundRect(ctx,280,sy-16,bw,22,6);ctx.fill();
      ctx.fillStyle='#ffffff';ctx.font='bold 24px Inter, sans-serif';ctx.textAlign='right';
      ctx.fillText(s.v+'/10',W-80,sy);
    });

    ctx.strokeStyle='#222';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(80,topY+360);ctx.lineTo(W-80,topY+360);ctx.stroke();

    var bY=topY+420;ctx.textAlign='center';
    ctx.fillStyle='#888';ctx.font='22px Inter, sans-serif';ctx.fillText('SKILL',W*0.2,bY);
    ctx.fillStyle='#fff';ctx.font='bold 28px Inter, sans-serif';ctx.fillText(SKILL_LABELS[data.sk]||data.sk||'—',W*0.2,bY+40);

    ctx.fillStyle='#888';ctx.font='22px Inter, sans-serif';ctx.fillText('RECOMMENDED RATE',W*0.5,bY);
    ctx.fillStyle='#00ff88';ctx.font='bold 28px Inter, sans-serif';ctx.fillText(data.bm?fmt$(data.bm)+'/hr':'—',W*0.5,bY+40);

    ctx.fillStyle='#888';ctx.font='22px Inter, sans-serif';ctx.fillText('REGION',W*0.8,bY);
    ctx.fillStyle='#fff';ctx.font='bold 28px Inter, sans-serif';ctx.fillText(COUNTRY_LABELS[data.c]||data.c||'—',W*0.8,bY+40);

    ctx.fillStyle='#0f0f0f';ctx.fillRect(0,H-80,W,80);
    ctx.fillStyle='#ff8844';ctx.font='bold 24px Inter, sans-serif';ctx.textAlign='left';
    ctx.fillText('cortexfreelancer.com',80,H-32);
    ctx.fillStyle='#444';ctx.font='22px Inter, sans-serif';ctx.textAlign='right';
    ctx.fillText('Get your free score',W-80,H-32);
  </script>
</body>
</html>
