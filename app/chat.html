    <style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;--bg4:#22222e;
  --text:#f0f0f0;--text2:#b0b0b0;--text3:#666666;
  --orange:#ff8844;--orange2:#ff6622;
  --green:#00ff88;--green2:#00cc6a;
  --radius:16px;--radius-sm:10px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;display:flex;flex-direction:column}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(20px);background:rgba(10,10,15,.85);border-bottom:1px solid rgba(255,255,255,.05)}
.nav-logo{font-size:1.1rem;font-weight:800;letter-spacing:2px;color:var(--orange);text-decoration:none}
.nav-links{display:flex;gap:1.5rem;align-items:center}
.nav-links a{color:var(--text2);font-size:.85rem;font-weight:500;letter-spacing:.5px;text-transform:uppercase;text-decoration:none}
.nav-links a:hover{color:var(--orange)}
#cortex-auth{display:flex;align-items:center}
.cortex-auth-btn{border:none;cursor:pointer;font-family:inherit;transition:all .2s;border-radius:100px;font-weight:600;font-size:.8rem;letter-spacing:.5px}
.cortex-login-btn{background:var(--orange);color:#000;padding:.45rem 1rem}
.cortex-login-btn:hover{background:var(--green);color:#000}
.cortex-logout-btn{background:var(--bg3);color:var(--text2);padding:.35rem .8rem;font-size:.75rem;border:1px solid rgba(255,255,255,.1)}
.cortex-logout-btn:hover{border-color:var(--orange);color:var(--orange)}
.cortex-user-info{display:flex;align-items:center;gap:.5rem}
.cortex-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover}
.cortex-avatar-placeholder{width:28px;height:28px;border-radius:50%;background:var(--orange);color:#000;display:grid;place-items:center;font-size:.75rem;font-weight:800}
.cortex-user-name{font-size:.8rem;color:var(--text2);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cortex-pro-badge{background:linear-gradient(135deg,var(--green),var(--green2));color:#000;font-size:.6rem;font-weight:800;padding:.15rem .5rem;border-radius:100px;letter-spacing:1px}

/* CHAT LAYOUT */
.chat-wrapper{flex:1;display:flex;flex-direction:column;padding-top:60px;max-width:800px;width:100%;margin:0 auto}

.chat-header{padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.05)}
.chat-header-left{display:flex;align-items:center;gap:.6rem}
.chat-header-left .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green2));display:grid;place-items:center;font-size:.9rem;font-weight:800;color:#000}
.chat-header-left span{font-weight:700;font-size:.95rem}
.chat-header-left .status{font-size:.7rem;color:var(--green);font-weight:500}
.btn-new-chat{background:var(--bg3);color:var(--text2);border:1px solid rgba(255,255,255,.1);padding:.4rem .9rem;border-radius:100px;font-size:.75rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-new-chat:hover{border-color:var(--orange);color:var(--orange)}

/* MESSAGES */
.chat-messages{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;scroll-behavior:smooth}
.chat-messages::-webkit-scrollbar{width:6px}
.chat-messages::-webkit-scrollbar-track{background:transparent}
.chat-messages::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

.message{display:flex;gap:.6rem;max-width:85%;animation:fadeIn .25s ease}
.message-user{align-self:flex-end;flex-direction:row-reverse}
.message-ai{align-self:flex-start}

.message .bubble{padding:.85rem 1.15rem;border-radius:var(--radius);font-size:.9rem;line-height:1.6;word-wrap:break-word}
.message-user .bubble{background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.15);color:var(--text)}
.message-ai .bubble{background:var(--bg2);border:1px solid rgba(255,255,255,.06);color:var(--text)}
.message-ai .msg-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green2));display:grid;place-items:center;font-size:.7rem;font-weight:800;color:#000;flex-shrink:0;margin-top:2px}

/* Markdown in AI messages */
.message-ai .bubble strong{color:var(--green)}
.message-ai .bubble code{background:var(--bg3);padding:.15rem .4rem;border-radius:4px;font-size:.82rem;color:var(--orange)}
.message-ai .bubble pre{background:var(--bg3);padding:.75rem;border-radius:8px;overflow-x:auto;margin:.5rem 0}
.message-ai .bubble pre code{background:none;padding:0;color:var(--text)}
.message-ai .bubble ul,.message-ai .bubble ol{padding-left:1.2rem;margin:.4rem 0}
.message-ai .bubble li{margin:.2rem 0}
.message-ai .bubble p{margin:.4rem 0}
.message-ai .bubble p:first-child{margin-top:0}
.message-ai .bubble p:last-child{margin-bottom:0}

/* TYPING INDICATOR */
.typing{display:flex;gap:.6rem;align-self:flex-start;max-width:85%}
.typing .msg-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green2));display:grid;place-items:center;font-size:.7rem;font-weight:800;color:#000;flex-shrink:0}
.typing .bubble{background:var(--bg2);border:1px solid rgba(255,255,255,.06);padding:.85rem 1.15rem;border-radius:var(--radius);display:flex;gap:.3rem;align-items:center}
.typing .dot{width:6px;height:6px;background:var(--text3);border-radius:50%;animation:typingDot 1.4s infinite}
.typing .dot:nth-child(2){animation-delay:.2s}
.typing .dot:nth-child(3){animation-delay:.4s}

/* INPUT */
.chat-input-area{padding:1rem 1.5rem;border-top:1px solid rgba(255,255,255,.05);background:rgba(10,10,15,.95);backdrop-filter:blur(10px)}
.chat-input-wrap{display:flex;gap:.6rem;align-items:flex-end;max-width:800px;margin:0 auto}
.chat-input-wrap textarea{flex:1;background:var(--bg2);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-sm);padding:.75rem 1rem;color:var(--text);font-family:inherit;font-size:.9rem;resize:none;outline:none;min-height:44px;max-height:150px;line-height:1.5;transition:border-color .2s}
.chat-input-wrap textarea:focus{border-color:var(--green)}
.chat-input-wrap textarea::placeholder{color:var(--text3)}
.btn-send{width:44px;height:44px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--green),var(--green2));border:none;cursor:pointer;display:grid;place-items:center;transition:all .2s;flex-shrink:0}
.btn-send:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-send:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.btn-send svg{width:20px;height:20px;fill:#000}

.chat-limit-banner{text-align:center;padding:.6rem;font-size:.8rem;color:var(--text2);background:var(--bg2);border-top:1px solid rgba(255,255,255,.05)}
.chat-limit-banner a{color:var(--orange);font-weight:600;text-decoration:none}
.chat-limit-banner a:hover{color:var(--green)}

/* WELCOME */
.welcome{text-align:center;padding:3rem 1rem;color:var(--text2)}
.welcome .icon{font-size:3rem;margin-bottom:1rem}
.welcome h2{font-size:1.3rem;font-weight:700;color:var(--text);margin-bottom:.5rem}
.welcome p{font-size:.9rem;max-width:400px;margin:0 auto .5rem}
.welcome-suggestions{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:1.5rem}
.welcome-suggestions button{background:var(--bg2);border:1px solid rgba(255,255,255,.08);color:var(--text2);padding:.5rem 1rem;border-radius:100px;font-size:.8rem;cursor:pointer;font-family:inherit;transition:all .2s}
.welcome-suggestions button:hover{border-color:var(--green);color:var(--green)}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes typingDot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

@media(max-width:640px){
  nav{padding:.75rem 1rem}
  .chat-messages{padding:1rem}
  .chat-input-area{padding:.75rem 1rem}
  .message{max-width:92%}
  .welcome-suggestions{flex-direction:column;align-items:center}
  .welcome-suggestions button{min-height:44px;width:100%}
  .btn-send{min-width:44px;min-height:44px}
  .btn-new-chat{min-height:44px}
  input,select,textarea{font-size:16px}
  button,.generate-btn,.copy-btn{min-height:44px}
}
@media(max-width:600px){.cortex-user-name{display:none}}
    
.skip-link{position:absolute;top:-100%;left:1rem;background:var(--orange,#ff8844);color:#000;padding:.75rem 1.5rem;border-radius:8px;font-weight:700;font-size:.9rem;z-index:9999;transition:top .2s}.skip-link:focus{top:1rem}
:focus-visible{outline:2px solid var(--orange,#ff8844);outline-offset:2px}
</style>

<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);border:0">AI Chat</h1>
<div class="chat-wrapper" id="main-content">
    <div class="chat-header">
        <div class="chat-header-left">
            <div class="avatar">AI</div>
            <div>
                <span>Cortex AI</span><br>
                <span class="status">Online</span>
            </div>
        </div>
        <button class="btn-new-chat" onclick="clearChat()">New Chat</button>
    </div>

    <div class="chat-messages" id="chatMessages" role="log" aria-live="polite">
        <div class="welcome" id="welcome">
            <div class="icon">💬</div>
            <h2>Chat with Cortex AI</h2>
            <p>Your personal freelance business advisor. Ask me anything about pricing, proposals, clients, and growing your business.</p>
            <div class="welcome-suggestions">
                <button onclick="sendSuggestion(this)">How do I set my hourly rate?</button>
                <button onclick="sendSuggestion(this)">Write a proposal for a web project</button>
                <button onclick="sendSuggestion(this)">How to handle a late-paying client?</button>
                <button onclick="sendSuggestion(this)">Best way to negotiate a raise on Upwork?</button>
            </div>
        </div>
    </div>

    <div class="chat-limit-banner" id="limitBanner" style="display:none">
        You've used <span id="limitCount">0</span>/5 free messages today.
        <a href="/pricing">Upgrade to Pro</a> for unlimited chat.
    </div>

    <div class="chat-input-area">
        <div class="chat-input-wrap">
            <textarea id="chatInput" aria-label="Chat message" placeholder="Ask Cortex AI anything about freelancing..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
            <button class="btn-send" id="btnSend" aria-label="Send message" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>
</div>

<script>
const STORAGE_KEY = 'cortex_chat_history';
const LIMIT_KEY = 'cortex_chat_limit';
const FREE_LIMIT = 5;

let messages = [];
let isLoading = false;

// Load chat history from localStorage
function loadHistory() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      messages = JSON.parse(saved);
      if (messages.length > 0) {
        document.getElementById('welcome').style.display = 'none';
        messages.forEach(m => renderMessage(m.role, m.content, false));
        scrollToBottom();
      }
    }
  } catch (e) { messages = []; }
}

function saveHistory() {
  // Keep last 50 messages
  const toSave = messages.slice(-50);
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave)); } catch (e) {}
}

// Daily message limit for free users
function getDailyUsage() {
  try {
    const data = JSON.parse(localStorage.getItem(LIMIT_KEY) || '{}');
    const today = new Date().toISOString().slice(0, 10);
    if (data.date !== today) return { date: today, count: 0 };
    return data;
  } catch (e) { return { date: new Date().toISOString().slice(0, 10), count: 0 }; }
}

function incrementUsage() {
  const usage = getDailyUsage();
  usage.count++;
  localStorage.setItem(LIMIT_KEY, JSON.stringify(usage));
  updateLimitBanner(usage);
}

function updateLimitBanner(usage) {
  // Check if user is Pro (set by pro-status.js)
  if (window.__cortexPro) return;
  const banner = document.getElementById('limitBanner');
  const countEl = document.getElementById('limitCount');
  if (usage.count >= 1) {
    banner.style.display = 'block';
    countEl.textContent = usage.count;
  }
  if (usage.count >= FREE_LIMIT) {
    document.getElementById('chatInput').disabled = true;
    document.getElementById('chatInput').placeholder = 'Daily free limit reached. Upgrade to Pro for unlimited chat.';
    document.getElementById('btnSend').disabled = true;
  }
}

// Render a message bubble
function renderMessage(role, content, animate = true) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message ' + (role === 'user' ? 'message-user' : 'message-ai');
  if (!animate) div.style.animation = 'none';

  if (role === 'assistant') {
    div.innerHTML = `<div class="msg-avatar">AI</div><div class="bubble">${formatMarkdown(content)}</div>`;
  } else {
    div.innerHTML = `<div class="bubble">${escapeHtml(content)}</div>`;
  }
  container.appendChild(div);
}

function showTyping() {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = `<div class="msg-avatar">AI</div><div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  container.appendChild(div);
  scrollToBottom();
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function scrollToBottom() {
  const container = document.getElementById('chatMessages');
  container.scrollTop = container.scrollHeight;
}

// Simple markdown renderer
function formatMarkdown(text) {
  let html = escapeHtml(text);
  // Code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // Italic
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  // Unordered list
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  // Ordered list
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Paragraphs
  html = html.replace(/\n\n/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  html = '<p>' + html + '</p>';
  // Clean up
  html = html.replace(/<p><\/p>/g, '');
  html = html.replace(/<p>(<ul>)/g, '$1');
  html = html.replace(/(<\/ul>)<\/p>/g, '$1');
  html = html.replace(/<p>(<pre>)/g, '$1');
  html = html.replace(/(<\/pre>)<\/p>/g, '$1');
  return html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Send message
async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || isLoading) return;

  // Check free limit
  if (!window.__cortexPro) {
    const usage = getDailyUsage();
    if (usage.count >= FREE_LIMIT) {
      updateLimitBanner(usage);
      return;
    }
  }

  // Hide welcome
  document.getElementById('welcome').style.display = 'none';

  // Add user message
  messages.push({ role: 'user', content: text });
  renderMessage('user', text);
  input.value = '';
  autoResize(input);
  scrollToBottom();

  isLoading = true;
  document.getElementById('btnSend').disabled = true;
  showTyping();

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages })
    });

    const data = await resp.json();
    hideTyping();

    if (!resp.ok) {
      const errorMsg = data.error || 'Something went wrong. Please try again.';
      renderMessage('assistant', errorMsg);
      // Don't save error messages to history
      messages.pop(); // Remove user message too
    } else {
      const reply = data.reply;
      messages.push({ role: 'assistant', content: reply });
      renderMessage('assistant', reply);
      saveHistory();
      incrementUsage();
      dataLayer.push({ event: 'chat_message_sent' });
    }
  } catch (err) {
    hideTyping();
    renderMessage('assistant', 'Network error. Please check your connection and try again.');
    messages.pop();
  }

  isLoading = false;
  document.getElementById('btnSend').disabled = false;
  document.getElementById('chatInput').focus();
  scrollToBottom();
}

function sendSuggestion(btn) {
  document.getElementById('chatInput').value = btn.textContent;
  sendMessage();
}

function clearChat() {
  messages = [];
  localStorage.removeItem(STORAGE_KEY);
  const container = document.getElementById('chatMessages');
  container.innerHTML = '';
  // Re-add welcome
  container.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="icon">💬</div>
      <h2>Chat with Cortex AI</h2>
      <p>Your personal freelance business advisor. Ask me anything about pricing, proposals, clients, and growing your business.</p>
      <div class="welcome-suggestions">
        <button onclick="sendSuggestion(this)">How do I set my hourly rate?</button>
        <button onclick="sendSuggestion(this)">Write a proposal for a web project</button>
        <button onclick="sendSuggestion(this)">How to handle a late-paying client?</button>
        <button onclick="sendSuggestion(this)">Best way to negotiate a raise on Upwork?</button>
      </div>
    </div>`;
  dataLayer.push({ event: 'chat_cleared' });
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

// Init
loadHistory();
updateLimitBanner(getDailyUsage());
</script>
