<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cortex AI — Your Freelancer Assistant</title>
<meta name="description" content="Chat with Cortex AI about proposals, rates, emails, job analysis, and freelance strategy.">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/css/chat.css">
</head>
<body class="chat-page">

<!-- Header -->
<div class="chat-header">
  <div class="chat-logo"><span>⚡</span> CORTEX AI</div>
  <div class="chat-header-right">
    <span class="chat-status" id="chat-status"></span>
    <span class="chat-badge" id="chat-badge"></span>
    <a href="/app/index.html" class="chat-back">← Dashboard</a>
  </div>
</div>

<!-- Messages -->
<div class="chat-messages" id="chat-messages">
  <!-- Welcome + messages rendered by JS -->
</div>

<!-- Typing indicator -->
<div class="chat-typing" id="chat-typing">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

<!-- Suggestions -->
<div class="chat-suggestions" id="chat-suggestions"></div>

<!-- Input -->
<div class="chat-input-bar">
  <textarea class="chat-textarea" id="chat-input" rows="1" placeholder="Ask Cortex anything about freelancing..."></textarea>
  <button class="chat-send" id="chat-send" title="Send">➤</button>
</div>

<!-- Scripts -->
<script src="/app/js/profile-bridge.js"></script>
<script src="/app/js/chat-system-prompt.js"></script>
<script src="/app/js/chat-session-store.js"></script>
<script src="/app/js/chat-limiter.js"></script>
<script src="/app/js/ws-reconnect.js"></script>
<script src="/app/js/ws-visibility-bridge.js"></script>
<script src="/app/js/chat-dispatcher.js"></script>
<script src="/app/js/chat-ui.js"></script>
</body>
</html>
