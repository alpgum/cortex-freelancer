<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cortex Freelancer — Tools</title>
  <link rel="stylesheet" href="/app/styles.css" />
  <style>
    body{background:#0a0a0a;color:#eaeaea;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .wrap{max-width:980px;margin:0 auto;padding:24px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    .h1{font-size:20px;font-weight:900}
    .muted{color:#9aa0a6;font-size:14px}
    .filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
    input,select{background:#111;border:1px solid #222;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;outline:none}
    input{min-width:240px;flex:1}
    select{min-width:160px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
    .tool-card{background:#111;border:1px solid #222;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
    .tool-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .tool-name{font-weight:900}
    .tool-desc{color:#b7b7b7;font-size:13px;line-height:1.4;min-height:36px}
    .tool-meta{color:#888;font-size:12px}
    .tool-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;border:1px solid #222}
    .badge.free{color:#00ff88;border-color:rgba(0,255,136,.25);background:rgba(0,255,136,.08)}
    .badge.pro{color:#ff8844;border-color:rgba(255,136,68,.25);background:rgba(255,136,68,.08)}
    .badge.req{color:#8ab4f8;border-color:rgba(138,180,248,.25);background:rgba(138,180,248,.08)}
    .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:10px 14px;font-weight:900;text-decoration:none;background:#00ff88;color:#001b10;border:1px solid rgba(0,255,136,.35)}
    .btn.secondary{background:#111;color:#eaeaea;border:1px solid #222}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="h1">Tools Directory</div>
        <div class="muted">Your Freelancer OpenClaw — pick a tool and jump in.</div>
      </div>
      <div style="display:flex;gap:10px">
        <a class="btn secondary" href="/app/index.html">Back to Dashboard</a>
        <a class="btn" href="/app/onboarding.html">Paste Upwork Profile</a>
      </div>
    </div>

    <div class="filters">
      <input id="q" placeholder="Search tools…" />
      <select id="cat">
        <option value="">All categories</option>
      </select>
    </div>

    <div id="tools" class="grid"></div>
  </div>

  <script src="/app/js/tool-registry.js"></script>
  <script src="/app/js/tools-page.js"></script>
</body>
</html>
