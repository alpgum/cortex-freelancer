<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex Freelancer — Smoke Tests</title>
    <style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;--bg4:#22222e;
  --text:#f0f0f0;--text2:#b0b0b0;--text3:#666666;
  --orange:#ff8844;--green:#00ff88;--red:#ff4466;
  --radius:12px;
}
html{font-size:16px}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;min-height:100vh;padding:2rem}

.page-header{max-width:900px;margin:0 auto 2rem;text-align:center}
.page-header h1{font-size:1.8rem;font-weight:900;letter-spacing:-1px;margin-bottom:.5rem}
.page-header h1 span{color:var(--orange)}
.page-header p{color:var(--text2);font-size:.9rem}

.controls{max-width:900px;margin:0 auto 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
#run-all-btn{
  background:linear-gradient(135deg,var(--orange),#ff6622);color:#000;
  padding:.75rem 2rem;border-radius:100px;font-weight:800;font-size:.95rem;
  border:none;cursor:pointer;font-family:inherit;transition:all .2s;
}
#run-all-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,136,68,.3)}
#run-all-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.test-count{color:var(--text3);font-size:.85rem}

/* Progress */
.progress-bar{display:none;max-width:900px;margin:0 auto 1.5rem;background:var(--bg3);border-radius:100px;height:8px;overflow:hidden;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--green));border-radius:100px;transition:width .3s ease;width:0}
.progress-text{max-width:900px;margin:-.5rem auto 1.5rem;text-align:right;font-size:.75rem;color:var(--text3)}

/* Summary */
.summary{display:none;max-width:900px;margin:0 auto 1.5rem;gap:1rem;justify-content:center;flex-wrap:wrap}
.summary-stat{
  background:var(--bg2);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);
  padding:1rem 1.5rem;text-align:center;min-width:140px;
}
.summary-stat .label{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:.25rem}
.summary-stat .value{font-size:1.8rem;font-weight:900}
.summary-stat.all-pass .value{color:var(--green)}
.summary-stat.has-fail .value{color:var(--red)}
.summary-stat .value.neutral{color:var(--text2)}

/* Results list */
.results-list{max-width:900px;margin:0 auto}
.result-row{
  display:grid;grid-template-columns:32px 1fr 180px 1fr 70px;gap:.75rem;
  align-items:center;padding:.65rem 1rem;
  background:var(--bg2);border:1px solid rgba(255,255,255,.06);
  border-radius:8px;margin-bottom:4px;font-size:.85rem;
  transition:border-color .2s;
}
.result-row:hover{border-color:rgba(255,255,255,.12)}
.result-row.pass{border-left:3px solid var(--green)}
.result-row.fail{border-left:3px solid var(--red)}
.result-icon{font-size:1.1rem;text-align:center}
.result-name{font-weight:700}
.result-page{color:var(--text3);font-size:.8rem;font-family:'SF Mono',Consolas,monospace}
.result-msg{color:var(--text2);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result-row.fail .result-msg{color:var(--red)}
.result-time{color:var(--text3);font-size:.78rem;text-align:right;font-family:'SF Mono',Consolas,monospace}

@media(max-width:768px){
  .result-row{grid-template-columns:28px 1fr 60px;font-size:.8rem}
  .result-page,.result-msg{display:none}
}
    </style>
</head>
<body>

<div class="page-header">
    <h1><span>Cortex</span> Smoke Tests</h1>
    <p>End-to-end regression tests for all freelancer tools</p>
</div>

<div class="controls">
    <button id="run-all-btn">Run All Tests</button>
    <span class="test-count"><span id="total-count">0</span> tests registered</span>
</div>

<div class="progress-bar" id="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
</div>
<div class="progress-text" id="progress-text"></div>

<div class="summary" id="summary">
    <div class="summary-stat">
        <div class="label">Passed</div>
        <div class="value" id="pass-count">0</div>
    </div>
    <div class="summary-stat">
        <div class="label">Failed</div>
        <div class="value" id="fail-count">0</div>
    </div>
    <div class="summary-stat">
        <div class="label">Duration</div>
        <div class="value neutral" id="total-duration">—</div>
    </div>
</div>

<div class="results-list" id="results-list"></div>

<script src="js/smoke-runner.js"></script>
</body>
</html>
