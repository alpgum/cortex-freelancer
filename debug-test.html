<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Debug Test</title>
    <style>
        body { font-family: monospace; background: #000; color: #00ff41; padding: 20px; }
        .log { border: 1px solid #00ff41; padding: 10px; margin: 10px 0; background: rgba(0,255,65,0.1); }
        button { background: #00ff41; color: #000; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; }
        input { background: #111; color: #00ff41; border: 1px solid #00ff41; padding: 5px; margin: 5px; }
    </style>
</head>
<body>
    <h1>🔧 WebSocket Debug Test</h1>
    <div>
        <input type="text" id="wsUrl" value="wss://notebooks-dpi-ict-established.trycloudflare.com/ws/chat" style="width:400px;">
        <button onclick="connectTest()">Connect Test</button>
        <button onclick="clearLogs()">Clear</button>
    </div>
    <div id="logs"></div>

    <script>
        let ws = null;
        function log(msg) {
            const div = document.createElement('div');
            div.className = 'log';
            div.innerHTML = `[${new Date().toISOString()}] ${msg}`;
            document.getElementById('logs').appendChild(div);
            console.log(msg);
        }

        function connectTest() {
            const url = document.getElementById('wsUrl').value;
            log(`🔗 Connecting to: ${url}`);
            
            try {
                ws = new WebSocket(url);
                
                ws.onopen = function(event) {
                    log(`✅ WebSocket CONNECTED: ${event.type}`);
                    // Send test ping
                    ws.send(JSON.stringify({type: 'ping'}));
                    log(`📤 Sent ping`);
                };
                
                ws.onmessage = function(event) {
                    log(`📥 Received: ${event.data}`);
                };
                
                ws.onclose = function(event) {
                    log(`❌ WebSocket CLOSED: code=${event.code}, reason="${event.reason}", clean=${event.wasClean}`);
                };
                
                ws.onerror = function(error) {
                    log(`💥 WebSocket ERROR: ${error}`);
                };
                
            } catch (e) {
                log(`🚨 Exception: ${e.message}`);
            }
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }
    </script>
</body>
</html>
